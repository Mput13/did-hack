  - id: R16
    title: Не стоять, пока модель думает
    criterion: Качество LLM-планирования и промптов (15%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — «можно после исправлений»; правка после G3
    experiment: E24
    result: >-
      Флажок llm_act_while_waiting: off (стоять, как раньше — по умолчанию), rule (ехать по плану правила, ответ
      модели сверять с текущим действием), leash («привязь»: до ответа не собирать и почти не ехать, из опасной зоны
      выезжать). Имитатор модели с задержкой 15 с, трудный уровень, 40 сценариев 7001–7040 (пересчёт на нынешнем
      коде): стоять 30,3 очка; rule 72,3 (+42,0 [+25,1; +59,6]); leash 73,0 (+42,6 [+25,2; +60,7]). При rule модель
      успевает решить 9% вопросов; leash выполняет миссию «ровно два образца» 20 из 20, запрет на область не держит.
      Срок ожидания ответа 45 с; зависший запрос не держит процесс. Два круга ревью, последний блокер исправлен
      ведущим. Продолжение R16b (9.10, ревью — «можно вливать»): настоящая модель qwen3.8-flash-next, быстрый
      симулятор, десять трудных сценариев 7001–7010 (уже использованных в E24), по одному прогону на режим: стоять
      34,7 очка (возврат 7 из 10), rule 73,2 (10 из 10; +38,5 [+3,4; +79,3]), leash 78,8 (10 из 10; +44,1 [+11,6;
      +80,8]); rule против leash — различие не показано. Актуальными приняты 7% ответов модели при rule и 68% при
      leash. Миссии словами: leash выполняет «ровно два образца» 6 из 6 и «после штрафа домой» 7 из 7 по существу,
      с задержкой на ответ модели; rule — 1 из 6. По умолчанию по-прежнему выключено; в Gazebo режимы не проверялись.
      Отчёт — research/findings/R16.md, таблицы — R16b-tables.md.
    source: research/notes/K3.md
    why: >-
      Модели МАИ отвечают 14–25 секунд, и всё это время робот стоит. В литературе запрос отправляют заранее, по дороге
      к текущей цели, а ответ к приезду уже готов.
    question: Сколько времени простоя снимает ранний запрос и как часто заранее полученный план устаревает к приезду?
    hypothesis: Простой сокращается не меньше чем вдвое; устаревших планов меньше 20%.
    refute: Если заранее полученный план приходится отбрасывать чаще чем в трети случаев.

  - id: R10
    title: Чинить адаптацию к смене грунта — свежие данные после тревоги
    criterion: Адаптивность (25%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, два круга
    experiment: E19s
    why: >-
