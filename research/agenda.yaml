  - id: G3
    title: Побочные эффекты защиты от потери положения
    criterion: Работоспособность агента (30%)
    status: assigned
    owner: Claude Opus 5.5
    why: >-
      Защита из G2 включена у всех агентов. Пересчёт опытов показал её цену в быстром симуляторе: в 17 прогонах со
      столкновением робот стал возвращаться реже (на 5 возвратов меньше), а исследователь в одном прогоне без
      столкновений перестал возвращаться (100% → 97,5%).
    question: Что именно делает защита в этих прогонах и как убрать вред, не потеряв пользу в Gazebo?
    hypothesis: После столкновения у опасной зоны робот едет медленно и получает повторные штрафы; правка возвращает возвраты к прежним.
    refute: Если после правки на изменившихся прогонах возвратов меньше, чем до G2, или в Gazebo снова теряется положение.

  - id: R1
    title: Когда умение замечать изменения начинает приносить очки
    criterion: Адаптивность (25%)
    status: published
    owner: код Gemini, исправлен Claude Opus 5.5 по ревью GPT-6.1 Sol (работа V1)
    why: >-
      Опыт E3 показал неприятное: адаптивный агент лучше фиксированного одинаково с изменениями среды и без них,
      а отключение «обнаружения изменений» и «памяти об опасных зонах» счёт не меняет (E2). То есть адаптация к
      изменениям пока не видна в числах, а это четверть оценки.
    question: При какой силе изменений среды механизмы адаптации дают измеримый выигрыш и дают ли вообще?
    hypothesis: >-
      Выигрыш полного агента над агентом без обнаружения изменений и без памяти об опасных зонах растёт с числом и
      силой изменений: при трёх сменах грунта и трёх новых опасных зонах он отличим от нуля.
    refute: Если и при самых сильных изменениях парная разность счёта включает ноль — механизмы бесполезны при наших правилах.
    experiment: E15

  - id: R3
    title: Способы оркестрации языковой модели на одной и той же модели
    criterion: Качество LLM-планирования и промптов (15%)
    status: published
    owner: Claude Opus 5.5 (черновик Gemini и Sol)
    why: >-
      Сейчас модель спрашивают один раз и берут план. Маленькая локальная Qwen при этом держит формат, но решает плохо
      (38 очков против 71 у правила): слишком рано едет домой. Вопрос, можно ли обвязкой исправить слабую модель.
    question: Меняет ли способ обращения к одной и той же модели качество планов?
    hypothesis: >-
      Схема «модель предлагает несколько планов, расчёт оценивает каждый, модель выбирает из оценённых» даёт счёт
      выше, чем один запрос, при той же модели; схемы «автор и критик» и «голосование» — промежуточный результат.
    refute: Если на одинаковых сценариях ни одна схема не лучше одного запроса — дело в модели, а не в обвязке.
    experiment: E16
    note: >-
      По совету обоих советников имитатор проверяет только обвязку. Сравнение способов идёт на моделях МАИ,
      одной и той же для всех способов, с контролем «расчёт сам выбирает лучший план» и с платой за время ожидания.

  - id: R4
    title: Насколько верны гипотезы в журнале агента
    criterion: Научный подход (15%)
    status: published
    owner: код Gemini, исправлен Claude Opus 5.5 по ревью GPT-6.1 Sol (работа V1)
    why: >-
      Журнал гипотез — то, по чему оценивают «научный подход» и бонус «лучший научный агент». Сейчас мы считаем, сколько
      гипотез агент сам подтвердил или опроверг, но не сверяем их со скрытой правдой сценария.
    question: Какая доля гипотез каждого вида верна по скрытой правде, и совпадает ли это с тем, что агент о них думает?
    hypothesis: >-
      Гипотезы о месте образца, которые агент пометил «подтверждена», верны почти всегда; гипотезы о цене грунта
      называют множитель с ошибкой не больше 30%; среди помеченных «опровергнута» есть заметная доля верных.
    refute: Если подтверждённые агентом гипотезы о грунте расходятся с правдой больше чем на 50% — журналу нельзя верить.
    experiment: E17

  - id: R8
    title: Что будет, если правила судьи не такие, как думает агент
    criterion: Работоспособность агента (30%)
    status: published
    owner: код Gemini, проверен и доведён GPT-6.1 Sol
    why: >-
      Расход и закон датчика в условии не заданы, это наши допущения (радиус сбора 0,30 м задан). Агент их «знает». Жюри спросит,
      что будет с чужим судьёй. Сейчас ответа числом нет.
    question: Насколько падает результат, если судья работает по другим правилам, чем предполагает агент?
    hypothesis: >-
      Ошибка в расходе на метр до полутора раз и в дальности датчика на четверть снижает долю собранных образцов не
      больше чем на 15 процентных пунктов; ошибка в форме закона датчика (не прямая, а квадратичная) ломает поиск сильнее.
    refute: Если при любом из отклонений агент собирает меньше фиксированного плана — карта вероятностей хрупка к правилам.
    experiment: E18

  - id: G1
    title: Сверка с Gazebo на большем числе сценариев
    criterion: Работоспособность агента (30%)
    status: published
    owner: ведущий
    note: >-
      Девять трудных сценариев: в Gazebo собрано 89% образцов против 87%, возврат 8 из 9 в обоих, счёт 76,2 против
      75,9; расхождение по образцам не больше одного. В одном прогоне (hard-5) робот после столкновений со столбом
      потерял положение и не вернулся — это разбирает G2.
    why: Опыт E7 — по одному сценарию на уровень; на трудном Gazebo дал на образец меньше и на штраф больше.
    question: Систематично ли расхождение на трудном уровне и в чём его причина?
    hypothesis: На восьми новых трудных сценариях Gazebo и быстрый симулятор расходятся не больше чем на один образец, возврат одинаков.
    refute: Если в Gazebo агент систематически собирает меньше или не возвращается — выводы серий на показ не переносятся.
    experiment: E7

  - id: G2
    title: Срыв определения положения после столкновения в Gazebo
    criterion: Работоспособность агента (30%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, два круга
    why: >-
      В сверке G1 в одном прогоне из девяти (hard-5) робот четыре раза задел столб, поправка курса по лидару
      скакнула на 131°, оценка положения ушла на 5 метров, на базу он не вернулся. В быстром симуляторе столкновение —
      только штраф, поэтому серии этого не видят. Для показа это прямой риск.
    question: Почему после столкновения поправка положения по лидару срывается и как сделать, чтобы робот возвращался?
    hypothesis: >-
      Колёса проскальзывают, одометрия уезжает, а поправка по лидару принимает ложное совмещение: арена
      шестиугольная и совпадает сама с собой при повороте на 60° и 120°. Запрет неправдоподобных скачков и отъезд
      от препятствия по лидару убирают срыв.
    refute: Если после правки hard-5 в трёх повторах из трёх снова не возвращается или срыв появляется в других сценариях.

  - id: V1
    title: Исправления по ревью кода исследований R1 и R4
    criterion: Научный подход (15%)
    status: published
    owner: Claude Opus 5.5 (находки — GPT-6.1 Sol, три круга ревью)
    experiment: E17
    why: >-
      Код R1 и R4 писал исследователь на Gemini. Ревью нашло: в генераторе новые опасные зоны иногда остаются без
      сбоя, а времена событий совпадают; в сверке гипотез непроверяемые гипотезы входят в знаменатель, несколько
      событий подряд учитываются неверно, окрестность грунта проверяется по точкам. И ошибку самого агента: разовую
      потерю заряда от штрафа он принимает за дорогой грунт.
    question: Устоят ли выводы R1 и R4 после исправлений и сколько стоит ошибка агента со штрафом?
    hypothesis: Вывод R1 не изменится; доли верных гипотез в R4 вырастут, потому что из знаменателя уйдут непроверяемые.
    refute: Если после исправлений подтверждённые агентом гипотезы верны реже чем в 80% случаев.

  - id: L2
    title: Модели МАИ как планировщик
    criterion: Качество LLM-планирования и промптов (15%)
    status: published
    owner: ведущий
    why: >-
      8.10 команда получила доступ к моделям МАИ — тем самым QWEN и DeepSeek, которые названы в условии. Локальная
      Qwen 2.5 больше не используется. Шесть моделей проверяются на тех же шести сценариях, что и остальные.
    question: Какая из моделей МАИ годится в планировщики робота — по доле годных планов, задержке и счёту?
    hypothesis: Все шесть держат формат не хуже 90% с первого раза при схеме ответа; по счёту не хуже правила.
    refute: Если модель даёт меньше 80% годных планов или счёт заметно ниже правила — в планировщики не годится.
    experiment: llm_real

  - id: R13
    title: Миссия словами — то, чего правило не умеет
    criterion: Качество LLM-планирования и промптов (15%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, замечания исправлены
    why: >-
      Все проверенные модели в 95–98% решений выбирают ту же цель, что и простое правило, и счёт одинаков. В условии
      задачи модель должна строить план «по текстовой миссии». Правило текст не читает; модель — читает. Здесь и
      должна проявиться её польза.
    question: Меняет ли модель поведение робота так, как сказано в миссии, если миссию задать другими словами?
    hypothesis: >-
      При миссиях «собери ровно два образца и возвращайся», «вернись, сохранив не меньше 30 единиц заряда», «не
      заезжай в правую половину арены» робот с моделью выполняет условие миссии заметно чаще, чем робот с правилом.
    refute: Если доля прогонов, где условие миссии выполнено, у модели не выше, чем у правила.

  - id: R15
    title: Что выберет модель, если не подсказывать ей формулу правила
    criterion: Качество LLM-планирования и промптов (15%)
    status: assigned
    owner: в составе L3
    source: research/notes/K3.md
    why: >-
      Обзор K3 заметил, а проверка подтвердила: в подсказке планировщика прямо написана формула простого правила
      «уверенность, делённая на цену пути». Совпадение моделей с правилом в 96–98% решений поэтому мало что говорит о
      самих моделях — им велели считать как правило.
    question: Как меняются решения и счёт той же модели, если формулу из подсказки убрать и оставить только цель?
    hypothesis: >-
      Без формулы модель совпадает с правилом заметно реже (меньше 85% решений), доля годных планов не падает ниже
      90%, счёт не ниже правила больше чем на 3 очка.
    refute: Если совпадение с правилом остаётся выше 95% — модель приходит к правилу сама; если счёт падает — формула была нужна.
    note: Запускать после R13 — он правит те же файлы подсказок. Модели МАИ, та же модель в обоих вариантах.

  - id: R16
    title: Не стоять, пока модель думает
    criterion: Качество LLM-планирования и промптов (15%)
    status: returned
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — «можно после исправлений»; правка после G3
    experiment: E24
    source: research/notes/K3.md
    why: >-
      Модели МАИ отвечают 14–25 секунд, и всё это время робот стоит. В литературе запрос отправляют заранее, по дороге
      к текущей цели, а ответ к приезду уже готов.
    question: Сколько времени простоя снимает ранний запрос и как часто заранее полученный план устаревает к приезду?
    hypothesis: Простой сокращается не меньше чем вдвое; устаревших планов меньше 20%.
    refute: Если заранее полученный план приходится отбрасывать чаще чем в трети случаев.

  - id: R10
    title: Чинить адаптацию к смене грунта — свежие данные после тревоги
    criterion: Адаптивность (25%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, два круга
    experiment: E19s
    why: >-
      Советник нашёл в коде причину: после тревоги «модель устарела» агент уменьшает вес всех данных о грунте,
      включая только что полученное свидетельство, и оценка возвращается к «обычному полу». Плюс генератор ставит
      изменения туда, куда агент не едет.
    question: Даёт ли правка забывания и честная постановка (изменение на пути между образцами и базой) измеримый выигрыш?
    hypothesis: >-
      Парная разность разностей (эффект механизма при изменении минус эффект без изменения) положительна и отличима
      от нуля; без изменения механизм счёт не ухудшает больше чем на 1 очко.
    refute: Верхняя граница 95% интервала разности разностей не выше нуля.
    note: >-
      Обзор K2 советует мерить эффект в окне после изменения (лишний расход, число повторных заездов в подорожавший
      участок), а не только по итоговому счёту: там он тонет в разбросе.

  - id: R14
    title: Агент сам калибрует датчик и расход
    criterion: Работоспособность агента (30%)
    status: returned
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — «можно после исправлений»
    experiment: E20
    why: >-
      R8 показал: агент хрупок к дальности и форме закона датчика (при законе «по корню» собирает 1% образцов) и к
      недооценённому расходу. Формула датчика — наше допущение; у чужого судьи агент должен её проверить сам. После
      первого собранного образца он знает, где тот лежал, а показания на подъезде записаны.
    question: Возвращает ли самокалибровка датчика и расхода результат к уровню «правила известны», и чего она стоит?
    hypothesis: >-
      С калибровкой при неверной дальности и при законе «по квадрату» агент собирает не менее 80% от того, что
      собирает при известных правилах; когда правила совпадают, калибровка счёт не ухудшает больше чем на 1 очко.
    refute: Если с калибровкой потери те же, что без неё, или она заметно вредит, когда правила совпадают.
    note: >-
      Обзор K1: если калибровки по первому образцу мало (при законе «по корню» первый образец можно и не найти),
      запасной вариант — вести несколько законов датчика одновременно и взвешивать их по тому, как сбываются показания.

