  - id: P2
    title: Следующие по величине потери очков на трудном уровне
    criterion: Работоспособность агента (30%)
    status: published
    owner: Claude Opus 5.5
    why: >-
      P1 убрал езду вслепую при сбое датчика (+6,4 очка), A1 показал, что агент с полными подсказками набирает 92,5 (оптимум не установлен) и что недобор — в знании об образцах
      и среде, а не в порядке обхода. Остались названные в P1 потери: невозврат по незнакомому полу, подъезды в неверную
      сторону, первый въезд в опасную зону, «образец знал, заряда хватало, а не собрал».
    question: Какие две-три потери можно убрать без скрытой правды и сколько это даёт на новых сценариях?
    hypothesis: Варианты adaptive_v3 и scientist_v3 набирают на трудном уровне на 3 очка и больше, чем _v2, при возврате не ниже.
    refute: Если на сценариях 11001–11040 интервал разности счёта включает ноль или возврат на базу стал ниже.
    experiment: E26
    result: >-
      Гипотеза не подтвердилась. Сценарии 11001–11040, трудный уровень, базовые правила: adaptive_v3 − adaptive_v2
      −0,39 [−1,18; +0,01], возврат 39 → 38 из 40; критерий (+3 очка) не выполнен. На научных правилах +2,34
      [+0,67; +4,23] при возврате 36 → 35. Проверено пять правок; помогла одна (поправка постоянного сдвига показаний
      датчика) и только на научных правилах. Новые варианты не включены и для показа не рекомендованы. Разбор потерь:
      недобор 16 очков на прогон на новых сценариях — первый въезд в невидимую зону 4,75, несобранные образцы по
      смешанным причинам; из них 2,5 очка — образцы, о которых робот знал и на которые заряда хватало, но подъезд не
      был назначен (не разобрано — исследование P3). Отчёт — research/findings/P2.md.

  - id: P3
    title: Образец известен, заряда хватает, а робот за ним не едет
    criterion: Работоспособность агента (30%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, два круга
    why: >-
      Ревью P2 разобрало статью потерь «причина неясна»: 2,5 очка на прогон на трудном уровне — десять образцов в
      девяти прогонах из сорока; в девяти случаях робот знал о месте с уверенностью от 0,35 (до 0,81), по его же
      расчёту заряда хватало, он проезжал в 25 см, а подъезд к образцу так и не был назначен.
    question: Почему подъезд не назначается и сколько очков даёт исправление?
    hypothesis: Причина — в отборе кандидатов или в пороге уверенности, а не в заряде; исправление даёт на трудном уровне +1,5 очка и больше при возврате не ниже.
    refute: Если на сценариях 13001–13040 интервал разности счёта включает ноль или возврат на базу стал ниже.
    experiment: E28
    result: >-
      Гипотеза не подтвердилась, приёмка не пройдена. Причина потери — не отбор кандидатов и не порог: место было
      слабым кандидатом, робот ехал к более верному образцу, а после сбора соседнего пересчёт карты образцов стирал
      знание о месте (пример hard-11005: уверенность 0,61 → 0,08). Попутный сбор (флажок pickup, adaptive_v4 и
      scientist_v4) на сценариях 13001–13040 при базовых правилах не сработал ни разу: +0,00 при нужных +1,5; при
      научных правилах +0,75 [0,00; +1,75] — различие не показано (до правки по ревью «финиш важнее попутного сбора»
      было +1,00 [+0,25; +2,00]); у scientist_v4 один лишний ложный сбор. Проба точного пересчёта карты (exact_replay)
      при научных правилах теряет 3,9 очка, причина не установлена — выключена. По умолчанию всё выключено, на показ
      идёт прежний агент. Разбор потерь теперь берёт кандидатов тем же кодом, что агент; статьи в таблицах P1 и P2
      получены прежней версией (помечено). Отчёт — research/findings/P3.md.

