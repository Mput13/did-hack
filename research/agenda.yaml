  - id: F2
    title: Проверить ключ --slam (карта от SLAM Toolbox, бонусный трек)
    criterion: Бонус «SLAM вместо готовой карты»
    status: idea
    owner: ведущий
    why: Ключ подключён, но ни разу не проверен; в условии требование — начало координат карты совпадает с мировым.
    note: >-
      Обзор K4: SLAM Toolbox ставит начало карты в точку старта робота, а база у нас в (−2,0; −0,5) — нужна
      постоянная поправка между системами координат или сдвиг начала в сохранённой карте.
