# План исследований. Ведёт основной ассистент; правила — research/PROTOCOL.md.
# status: idea → assigned → submitted → verified → published | rejected | returned
# criterion — к какому критерию оценивания из условия относится (вес в скобках).

studies:
  - id: P1
    title: Где робот теряет очки и как их вернуть
    criterion: Работоспособность агента (30%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, два круга
    why: >-
      Задание робота по условию — собрать как можно больше образцов и вернуться. На трудном уровне агент набирает
      72,6 очка из примерно 91 возможного (собрано 81% образцов, возврат 95%), на «научных» правилах — около 58–60.
      Куда уходят остальные очки, никто не разбирал: все прежние исследования проверяли отдельные механизмы, а не
      результат в целом.
    question: На каких причинах теряется больше всего очков и сколько возвращает исправление двух–трёх главных?
    hypothesis: >-
      Главные потери — образцы, брошенные из-за слишком раннего возврата, и лишний путь. Исправление двух–трёх
      главных причин даёт не меньше +3 очков на нетронутых сценариях без потери в доле возвратов.
    refute: Если на нетронутых сценариях 5001–5040 разность счёта «новый − прежний» включает ноль или возвратов стало меньше.
    experiment: E22b

  - id: A1
    title: Новые варианты устройства агента и потолок
    criterion: Работоспособность агента (30%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol, замечания исправлены
    why: >-
      Главное сравнение проекта — маршрут, спланированный заранее, против адаптивного агента. Но между ними есть и
      другие устройства: агент, который планирует весь остаток прогона и пересчитывает план после каждого сведения;
      агент, который сначала объезжает арену, а потом собирает. И неизвестно, сколько очков вообще достижимо.
    question: Какое устройство агента набирает больше всего и сколько остаётся до потолка?
    hypothesis: >-
      План на весь остаток прогона с пересчётом даёт не меньше +3 очков к нынешнему адаптивному агенту на нетронутых
      сценариях; «сначала разведка, потом сбор» проигрывает ему из-за заряда, потраченного на объезд.
    refute: Если разность счёта «новый вариант − адаптивный» на сценариях 6001–6040 включает ноль.
    experiment: E23b

  - id: L3
    title: Языковая модель в гипотезах и решениях робота
    criterion: Качество LLM-планирования и промптов (15%), Научный подход (15%)
    status: published
    owner: Claude Opus 5.5 (отдельный тред, ветка research/L3)
    why: >-
      Модель участвует всего в нескольких опытах, а использование LLM и автономное выдвижение гипотез — треть
      оценки. Гипотезы сейчас выдвигает и проверяет код; серии, где это делает модель, нет. Владелец проекта просил
      больше опытов с моделями.
    question: Что меняется, когда гипотезы выдвигает и критикует модель, а не код, и что модель решает сама, если ей не подсказывать правило?
    hypothesis: >-
      Модель в ролях автора и критика называет причину странности не хуже исследователя на коде и предлагает
      объяснения, которых в его списке нет; без формулы правила в подсказке модель совпадает с правилом реже 85%
      решений при той же доле годных планов.
    refute: Если с моделью в ролях верных выводов меньше, чем у исследователя на коде, или счёт без формулы падает больше чем на 3 очка.
    note: Включает прежние пункты R15 (подсказка без формулы) и расширение R13 (миссии на нескольких моделях и большем числе сценариев).
    result: >-
      Пять опытов на моделях МАИ (qwen3.8-flash-next, DeepSeek-V4-Flash, qwen3.6-35b-a3b). (a) Модель — автор и критик
      гипотез в расследованиях: счёт и выводы совпали с расчётом (65,01 против 65,01; строгий повтор из кэша на main после слияния 9.10 дал то же).
      (b) Модель выдвигает гипотезы сама, «в тени»: категория хотя бы одной настоящей причины есть среди её гипотез в
      93–98% случаев (по разметке моделью), а вывод по измерениям засчитан верным в 24–39% против 86% у расчёта.
      (c) Подсказка без формулы правила: совпадение с правилом 78% вместо 93%, по счёту различие не показано.
      (d) Миссии словами: 45–46 прогонов из 48 на каждой модели, у правила 0 из 48. (e) Объяснение готового
      расследования: в 118 принятых текстах из 125 причина та же, что у расчёта. Вывод: модель предлагает и объясняет,
      проверку делает расчёт. Отчёт — research/findings/L3.md.

  - id: M1
    title: Два робота, которые координируются (бонусный трек)
    criterion: Бонус «мультиагентный»
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — «можно после исправлений», второй круг после вливания
    result: >-
      Быстрый симулятор, 80 сценариев 10001–10040 (medium и hard), базовые правила. Двое с координацией против двоих
      без связи с объездом по лидару (пересчёт после G3): время прогона 103,7 → 77,8 с (−25,9 [−30,5; −21,2]), заряд
      100,4 → 74,1 ед. (−26,3 [−29,6; −22,8]), счёт команды 95,2 → 101,1 (+5,9 [+4,3; +7,7]), оба вернулись в 80
      прогонах из 80 против 75; собрано в среднем 99,8% против 98,8%. Последний образец быстрее не берётся (+3,5 с [−0,6; +8,1]). Со счётом
      одного робота счёт команды не сравнивается (двойной заряд и два бонуса за возврат). Gazebo: один прогон
      medium-3 — 5 из 5, оба вернулись, столкновений роботов 0. Отчёт — research/findings/M1.md.
    why: Владелец проекта решил закрыть и этот трек. Сначала надёжно в быстром симуляторе, затем, если получится, в Gazebo.
    question: Что даёт координация двух роботов по сравнению с двумя несогласованными и с одним?
    hypothesis: Двое с координацией собирают больше образцов и быстрее, чем двое без неё; двое без координации мешают друг другу.
    refute: Если разность «с координацией − без» на нетронутых сценариях включает ноль.
    experiment: E25

  - id: J1
    title: Модель решений Jev как быстрый сторож миссии
    criterion: Качество LLM-планирования и промптов (15%)
    status: published
    owner: Claude Opus 5.5
    result: >-
      Jev (typesafe/jev-1.13) поставлен сторожем перед планировщиком-правилом: отвечает, не нарушит ли подцель миссию,
      заданную словами. Быстрый симулятор, сценарии 1101–1110, 20 прогонов на миссию: «ровно два образца» — 20 из 20
      против 0 из 20 у правила и 20 у большой модели; «заряд не ниже 30» — 18 против 1 и 20; «не в правую половину» —
      17 против 0 и 17. Медиана зарегистрированного ответа 402 мс против 19–24 с у большой модели. Равноценность
      большой модели не установлена (две ошибки у порога заряда). Потрачено по учёту 0,23 доллара из разрешённого
      одного. По умолчанию сторож выключен; платный вызов невозможен без журнала расходов вне репозитория. Влито одним
      коммитом; ревью защиты денег и ключа — два круга. Отчёт — research/findings/J1.md.
    why: >-
      Большая модель понимает текст миссии, но отвечает 15 секунд и дольше; правило отвечает мгновенно, но текста не
      читает. Jev возвращает готовый выбор с вероятностью и должен отвечать быстро. Разрешена владельцем проекта:
      typesafe/jev-1.13, потолок 1 доллар.
    question: Соблюдает ли робот миссию, заданную словами, если подцели правила проверяет Jev, и сколько это стоит по времени?
    hypothesis: Сторож Jev выполняет миссии не реже большой модели при простое, близком к правилу; его вероятности откалиброваны.
    refute: Если миссии выполняются реже, чем с большой моделью, или ответ Jev не быстрее.

