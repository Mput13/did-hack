  - id: L4b
    title: Память о лаборатории между прогонами — робот учится на прошлых прогонах
    criterion: Адаптивность (25%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — числа воспроизведены, замечания к силе выводов исправлены ведущим
    why: >-
      В условии: «агент учится на ошибках и адаптирует поведение». Сейчас каждый прогон начинается с чистого листа;
      самая большая статья недобора на трудном уровне — штрафы за первый въезд в невидимую зону (3,2 очка на прогон, P2).
    question: >-
      Сколько даёт память о найденных опасных зонах и дорогом грунте во втором и третьем прогоне на той же арене и где она вредит?
    hypothesis: >-
      В условии «та же лаборатория, другие образцы» второй прогон с памятью набирает на 2 очка и больше, возврат не ниже; устаревшая память вредит не больше чем на 1 очко.
    refute: >-
      Если интервал парной разности включает ноль или возврат на базу стал ниже.
    experiment: L4b
    result: >-
      Гипотеза подтвердилась, приёмка пройдена. Робот сохраняет после прогона найденные им опасные зоны и участки
      дорогого грунта (места образцов и скрытая правда судьи в память не входят) и начинает следующий прогон на той же
      арене с ними как с предположениями (флажок lab_memory, агенты adaptive_v2_lab и scientist_v2_lab). Быстрый
      симулятор, трудный уровень, базовые правила, 40 новых лабораторий 15001–15040 × 4 раскладки образцов, второй
      прогон в той же лаборатории (расстановка и расписание событий повторяются, образцы в новых местах): +4,32 очка
      [+2,39; +6,31] против того же агента без памяти; первых въездов в опасную зону 63 вместо 95 на 160 прогонов;
      возвратов 158 против 156 из 160 (отсутствие ухудшения не доказано). Отдельное сравнение: своя память против
      чужой +2,45 [+0,24; +4,68] (дополнительный разбор). По основной раскладке +4,77 [+0,13; +9,63] — формальный
      критерий выполнен, но число, вероятно, завышено случайно низким прогоном без памяти. Тот же сценарий повторно:
      +7,45 [+3,20; +11,98]. Рост к третьему прогону не показан. Где вредит: чужая память на среднем уровне при научных
      правилах −1,79 [−2,98; −0,62]; третий прогон после чужой памяти — возврат 100% → 90%. На лабораторию с другим
      расписанием событий результат не переносится (нужен отдельный опыт). Языковая модель на память ссылается, но
      решений не меняет (8 прогонов). В Gazebo не проверялось; по умолчанию выключено. Отчёт — research/findings/L4b.md.

  - id: L5
    title: Чем модели МАИ отличаются как планировщики — качество решений в одинаковых состояниях
    criterion: Качество LLM-планирования и промптов (15%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — числа сходятся, выводы ослаблены ведущим
    why: >-
      L2 показал одинаковый счёт у шести моделей и правила, потому что в 96% состояний выбор совпадает; чей выбор лучше
      там, где они расходятся, не измерялось.
    question: >-
      В состояниях с настоящим выбором — кто теряет меньше очков относительно лучшего варианта: правило или какая-то из шести моделей?
    hypothesis: >-
      Хотя бы одна модель теряет меньше, чем правило; модели различаются между собой больше, чем на погрешность.
    refute: >-
      Если интервалы потерь правила и моделей перекрываются.
    experiment: L5
    result: >-
      Гипотезы не подтвердились: преимущество моделей над правилом и различия между моделями не показаны. Мерило —
      банк из 90 состояний с настоящим выбором (сценарии 16001–16040); цена каждого варианта первой подцели — итоговый
      счёт прогона, в котором подставлен этот вариант, а дальше играет правило (оценка задним числом, 8 продолжений).
      С нынешней подсказкой первая подцель у всех шести моделей МАИ та же, что у правила: 514 из 517 годных ответов —
      в подсказке записана формула правила. С подсказкой без формулы (дополнительный опыт, задуман после основного)
      модели расходятся с правилом в 26–33% решений, цена их выбора +0,1…+0,5 очка на решение, все интервалы включают
      ноль. Надёжно различается только формат: обе DeepSeek не укладываются в предел ответа в 11% состояний (18–27% без
      формулы). Правило уступает варианту, выбранному по половине продолжений, 1,38 очка на решение [0,65; 2,28] (это
      не предел улучшения); 58% этой суммы — в пяти состояниях из 90. Правка правила «цель дальше от базы стоит дороже»
      (plan_home_weight, агент adaptive_v6) на сценариях 16041–16080: +1,88 [−1,58; +5,87], возврат 35 против 34 из 40
      — приёмка не пройдена, по умолчанию выключено. Отчёт — research/findings/L5.md.

  - id: B1
    title: Карта образцов не должна терять соседний образец после сбора
    criterion: Работоспособность агента (30%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — замечания к выводам отчёта, исправлены ведущим
    why: >-
      P3 нашёл причину потери 1,0–2,75 очка на прогон: после сбора образца пересчёт карты стирает знание о соседнем.
      Проба точного пересчёта вредит при сбоях датчика (−3,9), причина не выяснена.
    question: >-
      Почему точный пересчёт вредит при сбоях датчика и можно ли сохранить соседа без этого вреда?
    hypothesis: >-
      Вред дают показания, снятые во время сбоя датчика; пересчёт, который им не верит, даёт на трудном уровне +1,5 очка и больше и не вредит при научных правилах.
    refute: >-
      Если на сценариях 17001–17040 интервал разности включает ноль или при научных правилах хуже больше чем на 1 очко.
    experiment: B1
    result: >-
      Гипотеза не подтвердилась, приёмка не пройдена. Новый пересчёт (настройка neighbor_replay, агенты adaptive_v5 и
      scientist_v5) сохраняет известное соседнее место (hard-11005: уверенность 0,61 → 0,42 вместо 0,08) и не пускает в
      карту залипшие и шумные показания, но на сценариях 17001–17040 трудного уровня даёт при базовых правилах
      +0,52 [−0,61; +1,94] при нужных +1,5 и на один возврат меньше (38 против 39 из 40); при научных правилах
      −0,55 [−1,61; +0,46]. Различие с adaptive_v2 не показано ни в одном условии; точная карта понадобилась в 8 сборах
      из 261. Вред прежней пробы точного пересчёта получил объяснение, поддержанное данными, но не доказанное:
      величина зависит от набора сценариев (−4,11 на сценариях 1–80, −0,07 на соседних 80); точная карта на каждом
      сборе меняет ход прогонов и прибавляет первые въезды в опасные зоны (122 против 87 на 160 прогонов); показания
      при залипшем датчике дают лишних ложных кандидатов (малая часть). По умолчанию выключено. Чтобы измерить эффект
      в пол-очка с точностью ±0,5, нужно около 720 сценариев. Отчёт — research/findings/B1.md.

