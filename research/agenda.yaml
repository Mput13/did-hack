      оракулом, которому изменения сообщают сразу. Если оракул не выигрывает у «замороженного» — сценарий ничего не проверяет.

  - id: R12
    title: Помогает ли именно выбор различающего опыта
    criterion: Научный подход (15%)
    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — «можно после исправлений», исправлено
    experiment: E27
    result: >-
      Быстрый симулятор, сценарии 12001–12040 (два набора правил × два уровня). Против случайного выбора опыта выбор с
      учётом цены снизил расход на расследование с 0,54 до 0,08 ед. (−0,46 [−0,62; −0,33]) и повысил долю расследований,
      где названа хотя бы одна настоящая причина, с 86,1% до 92,3% (+6,2 п.п. [+3,6; +9,1]). Число опытов то же, на счёт
      влияние не показано (−0,4 [−1,8; +1,0]). В нашем наборе опытов правило «самый дешёвый» дало тот же выбор на всех
      460 шагах: отдельное преимущество ранжирования по ожидаемой информации не показано. Выбор есть в трети
      расследований, по сути в паре «утечка или дорогой грунт». Отчёт — research/findings/R12.md.
    why: Исследователь выбирает опыт по ожидаемой пользе. Не проверено, что это лучше произвольного допустимого опыта.
    question: Меньше ли ошибок в причинах и не хуже ли счёт при выборе опыта по пользе против случайного выбора при том же бюджете?
    hypothesis: При выборе по пользе исходов «недостаточно данных» меньше, а заряда на опыты уходит не больше.
    refute: Если случайный выбор опыта даёт столько же верных выводов при том же расходе.

