    status: published
    owner: Claude Opus 5.5; ревью GPT-6.1 Sol — «можно после исправлений»
    experiment: E20
    result: >-
      Варианты adaptive_cal и adaptive_cal_v2 (с пережиданием сбоя датчика) сами проверяют дальность и форму закона
