title: 'Два робота: координация по каналу сообщений'
kind: team
question: >-
  Что даёт второй робот и что даёт координация двух роботов (обмен показаниями датчика, заявки на цели, сообщения о
  сборе, опасных зонах и дорогом грунте, деление арены на участки) по сравнению с двумя роботами, которые друг с
  другом не связаны?
hypothesis: >-
  Записано до прогонов на отложенных сценариях. (1) Два робота собирают большую долю образцов, чем один, и быстрее.
  (2) Координация по сравнению с двумя несвязанными роботами не снижает долю собранных образцов (допуск 0,02),
  сокращает среднее время до образца, время прогона и расход заряда и убирает дублирование — время, когда оба едут к
  одной цели. (3) Время до последнего сбора при неизменённом агенте (порог сбора 0,85) координация не сокращает: на
  отладочных сценариях оно оказалось на 6–7 с больше, потому что робот, знающий настоящее число оставшихся
  образцов, дольше набирает уверенность у последнего образца. При пороге 0,7, одинаковом для всех вариантов,
  координация сокращает и его.
method: >-
  Сценарии 10001–10040 уровней medium и hard, при отладке не использовались; условия — базовые правила и «научные».
  Счёт команды определён заранее (did/judge_team.py): сумма счетов роботов — 10 за образец, 20 за возврат каждого
  робота на своё место базы, штрафы каждого, 0,1 за единицу остатка заряда вернувшегося. Варианты: один робот; двое
  без координации (каждый — обычный агент, как будто он один); двое без связи, но с объездом другого робота по лидару
  (чтобы выигрыш координации не сводился к «не сталкиваться»); двое с координацией. Во всех вариантах агент один и
  тот же — adaptive. Те же варианты повторены с порогом уверенности для сбора 0,7 (подобран на сценариях 1–80,
  опыт E25_pilot). Вывод — по парным разностям на одинаковых сценариях и их 95% интервалам.
expect: >-
  Доля собранных у двух роботов близка к 1 в любом варианте — различие в доле между вариантами с двумя роботами
  будет малым. Главный выигрыш координации — заряд и время прогона: роботы знают, что всё собрано, и не ищут дальше.
refute: >-
  (1) опровергнуто, если интервал разности «двое с координацией − один» по доле собранных не лежит целиком выше нуля.
  (2) опровергнуто, если интервал разности доли «с координацией − без связи» лежит целиком ниже −0,02 либо интервал
  разности среднего времени до образца лежит целиком выше нуля; ноль внутри интервала — «различие не показано».
  (3) опровергнуто, если при пороге 0,85 координация значимо сокращает время до последнего сбора либо при пороге
  0,7 значимо его увеличивает.
levels: [medium, hard]
seeds: 40
seed_start: 10001
arms:
  - {id: solo, label: Один робот, team: solo}
  - {id: pair, label: Двое без координации, team: pair}
  - {id: pair_lidar, label: 'Двое без связи, объезд по лидару', team: pair_lidar}
  - {id: team, label: Двое с координацией, team: team}
  - {id: solo07, label: 'Один робот, порог 0,7', team: solo, config: {collect_confidence: 0.7}}
  - {id: pair_lidar07, label: 'Двое без связи, порог 0,7', team: pair_lidar, config: {collect_confidence: 0.7}}
  - {id: team07, label: 'Двое с координацией, порог 0,7', team: team, config: {collect_confidence: 0.7}}
conditions:
  - {id: base, label: Базовые правила}
  - {id: science, label: «Научные» правила,
     rules: {drain_per_rad: 0.12, load_drain: 0.05, battery_sigma: 0.02, faults: true, hazard_battery_hit: 0.0}}
metrics: [samples_share, mean_sample_time, t_last_collect, time, score, score_per_robot, returned, battery_used, penalties, robot_contacts, same_target_s]
claims:
  - {metric: samples_share, a: team, b: solo, text: 'Двое с координацией собирают больше, чем один'}
  - {metric: mean_sample_time, a: team, b: solo, text: 'Двое с координацией собирают быстрее, чем один'}
  - {metric: samples_share, a: team, b: pair_lidar, kind: noninferiority, margin: 0.02,
     text: 'Координация не снижает долю собранных против «без связи» (допуск 0,02)'}
  - {metric: mean_sample_time, a: team, b: pair_lidar, text: 'Координация сокращает среднее время до образца против «без связи»'}
  - {metric: time, a: team, b: pair_lidar, text: 'Координация сокращает время прогона против «без связи»'}
  - {metric: battery_used, a: team, b: pair_lidar, text: 'Координация экономит заряд против «без связи»'}
  - {metric: same_target_s, a: team, b: pair_lidar, text: 'Координация убирает езду вдвоём к одной цели'}
  - {metric: score, a: team, b: pair_lidar, text: 'Счёт команды с координацией выше, чем «без связи»'}
  - {metric: t_last_collect, a: team, b: pair_lidar, better: higher,
     text: 'Порог 0,85: время до последнего сбора с координацией не меньше (ожидаем больше)'}
  - {metric: t_last_collect, a: team07, b: pair_lidar07, text: 'Порог 0,7: координация сокращает время до последнего сбора'}
  - {metric: samples_share, a: team07, b: pair_lidar07, kind: noninferiority, margin: 0.02,
     text: 'Порог 0,7: координация не снижает долю собранных (допуск 0,02)'}
  - {metric: samples_share, a: team, b: pair, kind: noninferiority, margin: 0.02,
     text: 'Против «двое без координации» (как будто один): доля собранных не ниже (допуск 0,02)'}
  - {metric: score, a: team, b: pair, text: 'Против «двое без координации»: счёт команды выше'}
  - {metric: mean_sample_time, a: team, b: pair, text: 'Против «двое без координации»: среднее время до образца меньше'}
