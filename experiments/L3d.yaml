title: Миссия словами на большем числе сценариев и на нескольких моделях МАИ (R13 шире)
kind: llm
manual: "./px python tools/l3_planner.py missions"
question: >-
  С какой долей (и с каким интервалом) робот выполняет миссию, заданную словами, и одинаково ли это у разных
  моделей МАИ?
hypothesis: >-
  Вывод R13 (6 сценариев, одна модель) устоит: у qwen3.8-flash-next доля выполненных миссий M1 «ровно два образца»
  и M2 «сохрани 30 единиц заряда» не ниже 80%, M3 «не заезжай в правую половину» — не ниже 60%, M4 «после первого
  штрафа домой» со счётчиком штрафов — не ниже 80% прогонов со штрафом. Модели DeepSeek-V4-Flash и qwen3.6-35b-a3b
  отличаются от неё не больше чем на 20 процентных пунктов. Правило не выполняет M1–M4 (кроме случайных совпадений).
method: >-
  Миссии и проверка выполнения — из did/mission_criteria.py без изменений. Вариант обвязки — «модель отвечает на
  каждый повод» (mission_triggers, llm_min_interval_s = 0), для M4 ещё счётчик штрафов (state_penalties): в R13
  именно в нём миссия выполнялась. M1–M3: medium и hard, 1001–1006 (12 сценариев на ячейку); M4: 12 сценариев hard, где правило получает
  штраф (1001, 1003, 1009, 1013, 1015, 1016, 1018, 1019, 1020, 1022, 1023, 1024).
  Три модели и правило. Доля — с 95% интервалом Уилсона; для M4 знаменатель — прогоны, где штраф был.
refute: >-
  У qwen3.8-flash-next доля выполненных M1 или M2 ниже 50% либо нижняя граница интервала не выше доли правила —
  вывод R13 не устоял. Разница между моделями больше 20 пунктов с интервалом разности выше нуля — модели не равноценны.
levels: [medium, hard]
seeds: 12
amendment: >-
  Поправка до запуска моделей: в исходном наборе M4 (hard 1001–1012) правило получает штраф только в трёх
  сценариях, доля по трём прогонам ничего не оценивает. Набор заменён на первые 12 сценариев hard, где штраф
  получает правило (отбор по прогону правила, как в R13); ни одна модель на M4 к этому моменту не запускалась.
