title: Исследователь против адаптивного агента
kind: science
rules: science
question: Что даёт агенту умение расследовать странности, когда у одного симптома несколько настоящих причин?
hypothesis: >-
  Агент-исследователь, который держит несколько объяснений странности и проверяет их опытом, называет
  причину верно в подавляющем большинстве случаев и за счёт этого чаще возвращается на базу, чем
  адаптивный агент с одним объяснением на явление.
method: >-
  Правила среды усложнены: заряд уходит не только на путь по грунту, но и на повороты, на вес собранных
  образцов и на утечку после въезда в опасную зону; датчик образцов может зашуметь, залипнуть или
  начать занижать показания. Три агента проходят одни и те же сценарии. Выводы исследователя сверяются
  со скрытой правдой сценария.
expect: Исследователь тратит на опыты меньше одной единицы заряда за прогон и окупает их точным запасом на возврат.
refute: >-
  Гипотеза опровергнута, если исследователь ошибается с причиной чаще чем в одном случае из десяти
  или возвращается на базу не чаще адаптивного агента.
arms:
  - {id: fixed, label: Фиксированный план, agent: fixed}
  - {id: adaptive, label: С адаптацией, agent: adaptive}
  - {id: scientist, label: Исследователь, agent: scientist}
levels: [medium, hard]
seeds: 40
metrics: [returned, samples_share, score, battery_used, inq_correct, faults_found, inq_energy, inq_insufficient]
claims:
  - {metric: returned, a: scientist, b: adaptive, text: Исследователь возвращается на базу чаще адаптивного}
  - {metric: score, a: scientist, b: adaptive, text: Исследователь набирает не меньше очков, better: higher}
  - {metric: samples_share, a: scientist, b: fixed, text: Исследователь собирает больше фиксированного плана}
