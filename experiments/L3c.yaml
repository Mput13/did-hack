title: Что выберет модель, если не подсказывать ей формулу правила (R15)
kind: llm
manual: "./px python tools/l3_planner.py prompt"
question: >-
  Как меняются решения и счёт одной и той же модели-планировщика, если из подсказки убрать формулу простого правила
  «уверенность, делённая на цену пути» и оставить только цель?
hypothesis: >-
  Без формулы модель совпадает с правилом заметно реже — меньше чем в 85% решений; доля годных планов не падает
  ниже 90%; счёт не ниже счёта правила больше чем на 3 очка.
method: >-
  Модель qwen3.8-flash-next, два системных промпта: planner_system (с формулой, как в L2) и planner_system_goal
  (раздел «Как выбирать» заменён описанием цели и счёта; формулы, порядок «сначала кандидат, потом разведка» и
  примеры с готовым выбором убраны). Агент adaptive_llm, модель отвечает на каждый повод (llm_min_interval_s = 0),
  чтобы решения были её, а не правила; мир стоит, пока она думает. Сценарии medium и hard, 1001–1010; контроль —
  правило. Совпадение с правилом — по полю rule_match записи прогона (первая подцель модели против первой подцели
  правила на том же состоянии). Расхождения разбираются по видам и по парной разности счёта.
refute: >-
  Совпадение с правилом без формулы выше 95% — модель приходит к правилу сама. Парная разность счёта «без формулы −
  с формулой» целиком ниже нуля — формула была нужна. Годных планов меньше 90% — без формулы модель хуже держит формат.
levels: [medium, hard]
seeds: 10
