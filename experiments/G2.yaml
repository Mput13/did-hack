title: Столкновения как в Gazebo и потеря положения
kind: robustness
question: >-
  Что происходит с агентом, когда столкновение физическое (робот упёрся, колёса проскальзывают, одометрия
  уезжает), а курс временами рывком уходит мимо одометрии, — и спасает ли новая осторожность агента?
hypothesis: >-
  Агент, который не давит в преграду, отъезжает только туда, где лидар видит место, а потеряв положение,
  стоит и ищет себя по лидару, при рывках курса возвращается на базу не реже чем в 70% прогонов и почти не
  сталкивается. Прежний агент в тех же прогонах упирается в столбы и не возвращается. Пока рывков нет,
  результат обоих одинаков.
method: >-
  Уровень hard, одни и те же сценарии, умеренный уход одометрии (как в E8). Быстрый симулятор в режиме
  bump: в упоре корпус стоит, одометрия засчитывает 65% заданного пути, корпус сползает вбок, а после трёх
  секунд давления робот «раскачивается» и лидар слепнет до конца прогона (числа сняты с Gazebo опытом
  tools/gz_bump_test.py). Рывки курса (kick) — поворот корпуса на случайный угол до заданного, которого
  одометрия не видит, в среднем раз в 15 секунд езды: так в Gazebo ведёт себя робот, у которого колёса на миг
  потеряли пол. Рука «как раньше» — тот же агент с выключенным флажком guard.
expect: >-
  Без рывков столкновений нет и руки не различаются. При рывках до 60° прежний агент ещё справляется
  перебором курса, при рывках до 140° — теряется: это тот же срыв, что в Gazebo на hard-5.
refute: >-
  Гипотеза опровергнута, если при рывках до 140° новый агент возвращается реже чем в 70% прогонов или если
  без рывков он набирает меньше прежнего больше чем на 1 очко.
arms:
  - {id: guard, label: Осторожный (по умолчанию), agent: adaptive}
  - {id: blind, label: Как раньше, agent: adaptive, config: {guard: false}}
levels: [hard]
seeds: 30
conditions:
  - {id: bump, label: Упор физический, sim: {bump: true, odom_turn_slip: 0.2, odom_turn_scale: 0.01, odom_path_scale: 0.01}}
  - {id: kick60, label: И рывки курса до 60°, sim: {bump: true, kick: 1.0, kick_every: 15.0, odom_turn_slip: 0.2, odom_turn_scale: 0.01, odom_path_scale: 0.01}}
  - {id: kick140, label: И рывки курса до 140°, sim: {bump: true, kick: 2.5, kick_every: 15.0, odom_turn_slip: 0.2, odom_turn_scale: 0.01, odom_path_scale: 0.01}}
metrics: [score, samples_share, returned, collisions, penalties, time]
claims:
  - {metric: score, a: guard, b: blind, text: Осторожный агент набирает больше очков (без рывков разницы нет)}
  - {metric: returned, a: guard, b: blind, text: Осторожный агент чаще возвращается на базу}
  - {metric: collisions, a: guard, b: blind, text: У осторожного агента меньше столкновений, better: lower}
