title: Не стоять, пока модель думает — отладка, что делать с ответом, пришедшим после смены плана
kind: waiting
question: >-
  Сколько очков возвращает роботу режим «действовать, пока модель думает» по сравнению с нынешним «стоять и ждать
  ответа», и чем за это заплачено?
hypothesis: >-
  Если до ответа модели робот исполняет план правила, а ответ сверяет с тем, что уже делает, он вернёт не меньше 80%
  потери от ожидания на трудном уровне и будет не хуже «стоять и ждать» на среднем (допуск 1 очко).
method: >-
  Как в R3 (E16, условия wait15 и wait29), настоящей модели нет: имитатор отвечает как правило, но ответ «приходит»
  через 15 или 29 секунд времени прогона. Варианты: правило и имитатор без ожидания (потолок); «стоять и ждать» (как
  сейчас); новый режим в двух видах — весь план правила (rule) и только обратимое (safe: без сбора и не дальше 0,5 м
  от места вопроса, из опасной зоны — без ожидания). Три условия: имитатор всегда отвечает как правило; в 4% и в 20%
  решений называет другую достижимую цель — видно, как часто ответ приходит поздно и сколько переходов на план модели.
  Отладочная серия на сценариях 1–40 (из разрешённых 1–80): по ней выбраны порядок разбора ответа и длина привязи варианта safe. Выводов о гипотезе по ней не делается.
expect: >-
  «Ехать по правилу» совпадает с правилом без ожидания; «только обратимое» снимает штрафы за стоянку в опасной зоне,
  но часть времени простоя оставляет.
refute: >-
  Гипотеза опровергнута, если на нетронутых сценариях интервал парной разности счёта «новый режим − стоять и ждать»
  на трудном уровне включает ноль, либо возвращено меньше 80% потери, либо на среднем интервал выходит ниже −1 очка.
arms:
  - id: act15_drop
    label: Ехать по плану правила, 15 с; ответ после смены плана отбрасывается
    agent: adaptive_llm
    llm: {kind: mock}
    config: {llm_wait_s: 15, llm_act_while_waiting: rule, llm_wait_superseded: drop}
  - id: safe15_drop
    label: Только обратимое, 15 с; ответ после смены плана отбрасывается
    agent: adaptive_llm
    llm: {kind: mock}
    config: {llm_wait_s: 15, llm_act_while_waiting: safe, llm_wait_superseded: drop}
levels: [medium, hard]
seeds: 40
seed_start: 1
conditions:
  - id: dev4
    label: Имитатор в 4% решений называет другую цель (как настоящая модель в R3)
    llm: {deviate: 0.04}
  - id: dev20
    label: Имитатор в 20% решений называет другую цель
    llm: {deviate: 0.2}
metrics: [score, hazard_hits, returned, samples_share, idle_s, time, llm_calls, llm_late, llm_switches]
claims: []
