title: Уход одометрии и поправка по лидару
kind: robustness
question: Что происходит с агентом, когда одометрия врёт, как в Gazebo, и спасает ли поправка положения по лидару?
hypothesis: >-
  С поправкой положения по лидару и карте агент при уходе одометрии собирает столько же образцов и
  так же возвращается на базу, как при точной одометрии. Без поправки результат падает уже при
  умеренном уходе, а при точной одометрии поправка ничего не меняет.
method: >-
  Уровень medium, одни и те же сценарии. Одометрия быстрого симулятора портится по модели, снятой с
  Gazebo: при резкой смене угловой скорости колёса проскальзывают и одометрия засчитывает поворот,
  которого не было (odom_turn_slip — доля отставания корпуса от колёс), плюс постоянные ошибки
  масштаба поворота и пути. Умеренный уход — как в Gazebo, когда робот уже осел на колёса (сотые
  радиана на резкий разворот); сильный — как в первые 30 секунд после появления робота в мире,
  когда колёса проскальзывают на каждом развороте (десятые радиана).
expect: Без поправки ошибка положения за прогон дорастает до десятков сантиметров, робот бьётся о столбы и не находит базу.
refute: >-
  Гипотеза опровергнута, если при уходе одометрии агент с поправкой теряет больше одного образца
  из пяти против прогонов с точной одометрией или если поправка ухудшает результат при точной одометрии.
arms:
  - {id: lidar, label: С поправкой по лидару, agent: adaptive}
  - {id: odom, label: Только одометрия, agent: adaptive, config: {localize: false}}
levels: [medium]
seeds: 30
conditions:
  - {id: none, label: Одометрия точная}
  - {id: moderate, label: Умеренный уход, sim: {odom_turn_slip: 0.2, odom_turn_scale: 0.01, odom_path_scale: 0.01}}
  - {id: strong, label: Сильный уход, sim: {odom_turn_slip: 1.0, odom_turn_scale: 0.03, odom_path_scale: 0.03}}
metrics: [score, samples_share, returned, collisions, penalties, battery_used, time]
claims:
  - {metric: score, a: lidar, b: odom, text: С поправкой по лидару счёт выше (при точной одометрии разницы нет)}
  - {metric: samples_share, a: lidar, b: odom, text: С поправкой собрано больше образцов}
  - {metric: returned, a: lidar, b: odom, text: С поправкой робот чаще возвращается на базу}
  - {metric: collisions, a: lidar, b: odom, text: С поправкой меньше столкновений}
