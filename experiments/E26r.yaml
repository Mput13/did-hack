title: Агент v3 при правилах судьи, отличных от допущений агента
kind: main
question: Держится ли поведение агента v3 на наших же допущениях о правилах — цене простоя, длине сбоя датчика, дальности датчика образцов?
hypothesis: >-
  Правки P2 опираются на собственные замеры робота и на два допущения — дальность и обычный шум датчика образцов.
  При дорогом простое и длинном сбое датчика v3 не уступает v2. При другой дальности датчика поправка сдвига может
  ошибаться: заранее неизвестно, в какую сторону.
method: >-
  Четыре агента (adaptive_v2, adaptive_v3, scientist_v2, scientist_v3) проходят сценарии 11001–11020 трудного уровня
  при четырёх условиях, где судья считает иначе, чем думает агент: простой в 5 раз дороже; сбой датчика 90–120 с;
  дальность датчика образцов 1,6 м и 2,5 м при вере агента в 2,0 м. Запуск один, после заморозки кода и после E26.
expect: Возвратов не меньше, чем у v2, счёт ниже не больше чем на 1 очко.
refute: Хотя бы в одном условии adaptive_v3 возвращается реже adaptive_v2 или набирает меньше больше чем на 1 очко.
arms:
  - {id: adaptive_v2, label: Адаптивный v2, agent: adaptive_v2}
  - {id: adaptive_v3, label: Адаптивный v3, agent: adaptive_v3}
  - {id: scientist_v2, label: Исследователь v2, agent: scientist_v2}
  - {id: scientist_v3, label: Исследователь v3, agent: scientist_v3}
levels: [hard]
seeds: 20
seed_start: 11001
conditions:
  - {id: idle5, label: Простой в 5 раз дороже, rules: {drain_idle_per_s: 0.05}}
  - {id: long_fault, label: Сбой датчика 90–120 с, scenario: {fault_duration: [90.0, 120.0]}}
  - {id: range16, label: 'Дальность датчика 1,6 м (агент верит в 2,0)', rules: {sensor_range_m: 1.6}, agent_rules: {}}
  - {id: range25, label: 'Дальность датчика 2,5 м (агент верит в 2,0)', rules: {sensor_range_m: 2.5}, agent_rules: {}}
  - id: science_range25
    label: 'Научные правила, дальность 2,5 м (агент верит в 2,0)'
    rules: {drain_per_rad: 0.12, load_drain: 0.05, battery_sigma: 0.02, faults: true, hazard_battery_hit: 0.0, sensor_range_m: 2.5}
    agent_rules: {drain_per_rad: 0.12, load_drain: 0.05, battery_sigma: 0.02, faults: true, hazard_battery_hit: 0.0}
metrics: [score, samples_share, returned, penalties, hazard_hits, false_collects, time, distance, battery_used]
claims:
  - {metric: score, a: adaptive_v3, b: adaptive_v2, focus: hard, kind: noninferiority, margin: 1.0,
     text: Адаптивный v3 не теряет очков при чужих правилах}
  - {metric: returned, a: adaptive_v3, b: adaptive_v2, focus: hard, better: higher, kind: noninferiority, margin: 0.05,
     text: Адаптивный v3 возвращается не реже при чужих правилах}
