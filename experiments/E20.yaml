title: Агент сам проверяет допущения о датчике и расходе
kind: sensitivity
control_condition: base
question: >-
  Может ли агент по ходу прогона сам проверить и поправить свои допущения о датчике образцов и о расходе заряда —
  и возвращает ли это результат к уровню «правила известны»?
hypothesis: >-
  С самокалибровкой при неверной дальности датчика и при законе «по квадрату» агент собирает не менее 80% того, что
  собирает при известных правилах; когда правила совпадают с допущениями, калибровка не ухудшает счёт больше чем на
  1 очко.
method: >-
  Четыре варианта проходят одни и те же сценарии. Адаптивный — как есть: верит в прямую с дальностью 2,0 м и расход
  2,5 ед/м. Адаптивный с калибровкой (did/calibrate.py) начинает с тех же допущений, но ведёт несколько карт
  вероятностей с разными законами датчика 1 − (d/R)^p и держится той, что лучше предсказывает показания, после
  сбора сверяет закон по парам «расстояние — показание», а расход на метр меряет по пройденному пути. Подъём по
  сигналу — стратегия без карты. Четвёртый вариант — ориентир «правила известны»: тому же адаптивному агенту
  настоящие дальность, форма закона и расход сообщены заранее (в самом мире ничего не меняется).
  В условиях мир отличается от того, во что верят первые три варианта: совпадает (контроль); расход на метр ×1,5;
  дальность датчика 1,5 м и 2,5 м; закон quadratic = max(0, 1 − (d/R)^2) и sqrt = max(0, 1 − sqrt(d/R));
  сочетание дальности 1,5 м и расхода ×1,5. Параметры калибровки подобраны на сценариях 1–80, серия идёт на
  отложенных 1001–1040.
  Второй круг (после ревью): серия пересчитана на тех же сценариях после исправлений — одинаковый шум пустого
  поля у всех гипотез, образец в круге сбора, вывод о расходе отдельно от осторожной оценки. Это пересчёт после
  исправления, а не новая отложенная серия; числа первого круга — в research/findings/R14-E20-round1.json.
expect: >-
  При неверном законе датчика калибровка возвращает большую часть потерянных образцов; при неверном расходе —
  возврат на базу. Когда правила совпадают, счёт не хуже, чем без калибровки, с допуском 1 очко.
refute: >-
  Если с калибровкой потери те же, что без неё, или она заметно вредит, когда правила совпадают.
arms:
  - {id: adaptive, label: Адаптивный, agent: adaptive}
  - {id: adaptive_cal, label: Адаптивный с калибровкой, agent: adaptive_cal}
  - {id: gradient, label: Подъём по сигналу, agent: gradient}
  - {id: adaptive_known, label: Правила известны (ориентир), agent: adaptive_known, knows_rules: true}
levels: [medium, hard]
seeds: 40
conditions:
  - {id: base, label: Контроль (совпадает), agent_rules: {}}
  - {id: drain_x15, label: Расход ×1.5 (3.75 ед/м), rules: {drain_per_m: 3.75}, agent_rules: {}}
  - {id: range_15, label: Дальность 1.5 м (вера 2.0), rules: {sensor_range_m: 1.5}, agent_rules: {}}
  - {id: range_25, label: Дальность 2.5 м (вера 2.0), rules: {sensor_range_m: 2.5}, agent_rules: {}}
  - {id: law_quad, label: Закон quadratic (вера linear), rules: {sensor_law: 'quadratic'}, agent_rules: {}}
  - {id: law_sqrt, label: Закон sqrt (вера linear), rules: {sensor_law: 'sqrt'}, agent_rules: {}}
  - id: range_15_drain_x15
    label: Дальность 1.5 м и расход ×1.5
    rules: {sensor_range_m: 1.5, drain_per_m: 3.75}
    agent_rules: {}
metrics: [samples_share, returned, score, false_collects, battery_used]
claims:
  - metric: samples_share
    a: adaptive_cal
    b: adaptive
    text: С калибровкой агент собирает больше образцов, чем без неё, в каждом условии
  - metric: score
    a: adaptive_cal
    b: adaptive
    text: С калибровкой счёт не ниже, чем без неё (в контроле — «не хуже» с допуском 1 очко, см. отчёт R14)
  - metric: samples_share
    a: adaptive_cal
    b: gradient
    text: С калибровкой агент собирает больше образцов, чем подъём по сигналу, в каждом условии
