title: Адаптация против фиксированного плана
kind: main
question: Выигрывает ли агент, который меняет план по измерениям, у агента с планом, составленным до старта?
hypothesis: >-
  Агент, который по данным датчиков обновляет модель среды и перестраивает маршрут, соберёт больше
  образцов и чаще вернётся на базу, чем агент с фиксированным планом.
method: >-
  Два агента проходят одни и те же сценарии: одинаковые места образцов, грунты и события. Отличие
  одно — разрешено ли менять план по ходу прогона. Сравниваем разности на каждом сценарии.
expect: Разница растёт с уровнем — в easy почти нет, в hard наибольшая.
refute: >-
  Гипотеза опровергнута, если на одинаковых сценариях адаптивный агент не собирает больше образцов
  или возвращается на базу реже фиксированного.
arms:
  - {id: fixed, label: Фиксированный план, agent: fixed}
  - {id: adaptive, label: С адаптацией, agent: adaptive}
levels: [easy, medium, hard]
seeds: 40
metrics: [samples_share, returned, battery_used, score, penalties, time]
claims:
  - {metric: samples_share, a: adaptive, b: fixed, text: Адаптивный собирает больше образцов}
  - {metric: returned, a: adaptive, b: fixed, text: Адаптивный возвращается на базу не реже, better: higher}
  - {metric: battery_used, a: adaptive, b: fixed, text: Адаптивный тратит меньше заряда}
  - {metric: score, a: adaptive, b: fixed, text: Адаптивный набирает больше очков}
