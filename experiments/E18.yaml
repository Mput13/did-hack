title: Что будет, если правила судьи не такие, как думает агент
kind: sensitivity
control_condition: base
question: >-
  Насколько падает результат, если судья работает по другим правилам, чем предполагает агент?
hypothesis: >-
  Ошибка в расходе на метр до полутора раз и в дальности датчика на четверть снижает долю собранных образцов не
  больше чем на 15 процентных пунктов; ошибка в форме закона датчика (не прямая, а квадратичная) ломает поиск сильнее.
method: >-
  Сравниваем три варианта агента: адаптивный (карта вероятностей), фиксированный объезд и подъём по сигналу
  («ехать, пока теплее» из did/baselines.py; карта не нужна, но порог сбора, шаг и критерий роста сигнала
  используют номинальную линейную зависимость).
  Уровни medium и hard, 40 сценариев.
  В условиях мир отличается от того, во что верит агент: совпадает (контроль); расход на метр ×1,5 (3,75 ед/м) и
  ×0,67 (1,675 ед/м); дальность датчика 1,5 м и 2,5 м при вере в 2,0 м; радиус сбора 0,20 м при вере в 0,30 м;
  шум датчика 0,10 при вере в 0,05; закон датчика quadratic и sqrt при вере в линейный.
  Здесь quadratic = max(0, 1-(d/R)^2), sqrt = max(0, 1-sqrt(d/R)); шум добавляется после закона,
  затем показание обрезается до [0,1]. Радиус 0,30 м задан условием: 0,20 м — отдельный стресс-тест.
expect: >-
  Адаптивный агент сохраняет преимущество над базовыми стратегиями при умеренных отклонениях расхода и шума,
  но сильнее всего страдает от завышенного радиуса сбора (штрафы за промахи) и искажения закона датчика.
refute: >-
  Если при любом из отклонений агент собирает меньше фиксированного плана — карта вероятностей хрупка к правилам.
arms:
  - {id: adaptive, label: Адаптивный, agent: adaptive}
  - {id: fixed, label: Фиксированный, agent: fixed}
  - {id: gradient, label: Подъём по сигналу, agent: gradient}
levels: [medium, hard]
seeds: 40
conditions:
  - {id: base, label: Контроль (совпадает)}
  - {id: drain_x15, label: Расход ×1.5 (3.75 ед/м), rules: {drain_per_m: 3.75}, agent_rules: {}}
  - {id: drain_x067, label: Расход ×0.67 (1.675 ед/м), rules: {drain_per_m: 1.675}, agent_rules: {}}
  - {id: range_15, label: Дальность 1.5 м (вера 2.0), rules: {sensor_range_m: 1.5}, agent_rules: {}}
  - {id: range_25, label: Дальность 2.5 м (вера 2.0), rules: {sensor_range_m: 2.5}, agent_rules: {}}
  - {id: collect_020, label: Радиус сбора 0.20 м (вера 0.30), rules: {collect_radius_m: 0.20}, agent_rules: {}}
  - {id: noise_010, label: Шум датчика 0.10 (вера 0.05), rules: {sensor_sigma: 0.10}, agent_rules: {}}
  - {id: law_quad, label: Закон quadratic (вера linear), rules: {sensor_law: 'quadratic'}, agent_rules: {}}
  - {id: law_sqrt, label: Закон sqrt (вера linear), rules: {sensor_law: 'sqrt'}, agent_rules: {}}
metrics: [samples_share, returned, score, false_collects, battery_used]
claims:
  - {metric: score, a: adaptive, b: fixed, text: Адаптивный набирает больше очков, чем фиксированный}
  - {metric: score, a: adaptive, b: gradient, text: Адаптивный набирает больше очков, чем gradient}
  - metric: samples_share
    a: adaptive
    b: fixed
    text: Адаптивный собирает больше образцов, чем фиксированный, в каждом условии
  - metric: samples_share
    a: adaptive
    b: gradient
    text: Адаптивный собирает больше образцов, чем подъём по сигналу, в каждом условии
