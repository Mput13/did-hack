title: Модель выдвигает гипотезы сама — без списка объяснений от кода
kind: llm
manual: "./px python tools/l3_open.py"
rules: science
question: >-
  Может ли модель МАИ сама, без списка объяснений и предсказаний, которые готовит код, назвать возможные причины
  странности, выбрать опыт и по измерению сделать верный вывод? Предлагает ли она объяснения, которых в коде нет?
hypothesis: >-
  По описанию странности и общему описанию мира (на уровне условия задачи, без перечня видов сбоев) модель
  qwen3.8-flash-next называет настоящую причину среди своих гипотез не реже чем в 80% расследований и ставит её
  первой не реже чем в 50%. Вывод модели по тем же измерениям, что получил код, верен реже, чем вывод расчёта:
  разница не меньше 10 процентных пунктов (модели нечем считать правдоподобия). Не меньше 10% гипотез модели не
  укладываются ни в одно объяснение из списка кода.
method: >-
  Берутся все расследования варианта code опыта L3a (одни и те же для всех моделей — сравнение парное). Робот при
  этом едет по коду; модель отвечает «в тени» и на прогон не влияет. Шаг 1: модель получает странность, состояние
  робота, перечень доступных манёвров (без предсказаний и вероятностей) и выдаёт 2–5 гипотез и первый опыт. Шаг 2: в
  том же разговоре получает результаты опытов, которые провёл робот, и нормы расхода и шума; выдаёт вывод. Тексты
  гипотез и вывода раскладывает по категориям отдельный запрос-разметчик (всегда qwen3.8-flash-next); выборку
  разметки инженер проверяет глазами. Правда — из did.metrics.score_inquiries. Модели: qwen3.8-flash-next,
  DeepSeek-V4-Flash, qwen3.6-35b-a3b. Подсказки отлаживаются только на сценариях 1–80.
refute: >-
  «Модель умеет выдвигать»: опровергнуто, если настоящая причина есть среди гипотез реже чем в 60% расследований.
  «Вывод модели хуже расчёта»: если 95% интервал парной разности долей верных выводов (код − модель) включает ноль —
  различие не показано; если целиком ниже нуля — опровергнуто, модель точнее.
levels: [hard, medium]
seeds: 20
