title: Модель объясняет завершённое расследование — не расходится ли текст с числами расчёта
kind: llm
manual: "./px python tools/l3_explain.py"
rules: science
question: >-
  Можно ли показывать жюри объяснение расследования, написанное моделью: называет ли текст ту же причину, что
  посчитал код, и нет ли в нём чисел, которых не было в измерениях?
hypothesis: >-
  qwen3.8-flash-next пишет объяснение, которое проходит проверку программы (объём, ссылка на измерение, согласие со
  статусом вывода, без своих вероятностей), не реже 90% с первой попытки. Среди принятых текстов причина совпадает с
  выводом расчёта не реже 95%, и не больше 5% текстов содержат число, которого нет во входе и которое не получается
  из входных чисел разностью, отношением или округлением.
method: >-
  Все завершённые расследования варианта code опыта L3a; на каждое — один запрос роли explain (и одно исправление,
  если проверка не прошла). Три модели на одних расследованиях. Независимо от проверки программы: (1) причину,
  названную в тексте, определяет запрос-разметчик (qwen3.8-flash-next) и она сверяется с conclusion.best; (2) каждое
  число текста ищется во входе. Спорные случаи инженер читает сам. Робот в опыте не едет: это проверка текста.
refute: >-
  Больше 10% принятых текстов называют другую причину или содержат придуманное число — без человека показывать
  такие объяснения нельзя. Годных с первой попытки меньше 80% — роль ненадёжна.
levels: [hard, medium]
seeds: 20
