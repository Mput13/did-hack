title: Память о лаборатории между прогонами (L4b)
kind: science
manual: ./px python tools/l4b_run.py --jobs 2
question: >-
  Робот, который уже работал на этой арене, запоминает, где получил штраф за опасную зону и где пол оказался
  дорогим. Набирает ли он в следующем прогоне в той же лаборатории больше очков, чем такой же робот без памяти,
  и сколько он теряет, если лабораторию с тех пор переставили?
hypothesis: >-
  Память о зонах и грунтах даёт выигрыш: во втором прогоне в той же лаборатории (грунты, зоны и расписание
  событий прежние, образцы лежат в новых местах) робот с памятью набирает больше, чем тот же робот без памяти на
  тех же сценариях, потому что не платит штраф за въезд в зону, которую уже находил, и не едет по полу, который
  уже измерил как дорогой. Ожидание, записанное до прогонов: выигрыш в условии «та же лаборатория, другие
  образцы» скромный, около +1…+2 очков на прогон на трудном уровне, то есть на границе порога приёмки или ниже
  него. Причины: за один прогон робот находит не все зоны (в память попадает только зона, в которую он въехал),
  новые образцы ведут его другими дорогами, а грунты на трудном уровне меняются по ходу прогона, так что память
  хранит их расстановку на конец прошлого прогона, а не на начало следующего. При повторе того же сценария
  выигрыш должен быть больше (около +3 очков): дороги те же, и известны именно те зоны, в которые робот въезжал.
  Память от другой лаборатории не должна стоить больше 1 очка: неверное предположение снимается первым же
  проездом без штрафа или с обычным расходом.
method: >-
  Генератор сценариев получил параметр sample_seed: расстановка грунтов, зон и расписание событий берутся как у
  сценария (уровень, seed), а образцы раскладываются заново (без параметра сценарии прежние). Лаборатория — это
  seed, раскладка образцов — sample_seed 1, 2, 3. Три условия, в каждом цепочка из трёх прогонов подряд, память
  копится от прогона к прогону (файл runs/L4b/lab/…json): (а) same_lab — лаборатория L, раскладки 1 → 2 → 3;
  (б) repeat — лаборатория L, раскладка 2 три раза подряд (места образцов в память не идут и здесь);
  (в) moved — первый прогон в другой лаборатории (соседний seed, раскладка 1), второй и третий — в лаборатории L
  на раскладках 2 и 3, то есть второй прогон идёт с памятью о чужой расстановке. Второй прогон во всех трёх
  условиях — один и тот же сценарий (L, раскладка 2), различается только память. Справочно — условие repeat_std:
  прежний сценарий без sample_seed три раза подряд (зоны там стоят «между образцами»). Сравнение парное: прогон
  с памятью минус прогон того же агента без памяти на том же сценарии; интервалы — бутстреп по парным разностям.
  Агенты: adaptive_v2_lab против adaptive_v2 и scientist_v2_lab против scientist_v2; уровни hard и medium;
  правила базовые и «научные»; сценарии 15001–15040 (до заморозки кода не запускались и не просматривались;
  отладка и подбор чисел — только на сценариях 1–80). Запуск один. Метрики: счёт, доля образцов, возврат,
  штрафы за зоны всего и за первый въезд в зону, расход заряда, ложные сборы; разбор потерь по статьям
  (tools/loss_breakdown.py) без памяти и с памятью.
expect: >-
  Критерий приёмки (задан ведущим до работы), агент adaptive_v2_lab против adaptive_v2: в условии (а) на трудном
  уровне при базовых правилах счёт второго прогона с памятью выше на 2 очка и больше, 95% интервал парной
  разности выше нуля, возврат на базу не ниже; в условии (в) там же — не хуже чем на 1 очко (интервал не целиком
  ниже −1); на среднем уровне в условиях (а) и (в) — не хуже чем на 1 очко.
refute: >-
  Гипотеза «память о зонах и грунтах даёт выигрыш» опровергнута, если в условии (а) на трудном уровне при базовых
  правилах средняя парная разность счёта второго прогона не выше нуля; если ноль внутри 95% интервала — «выигрыш
  не показан». Механизм считается неработающим, даже если счёт вырос, если в условии (б) — где известны именно
  те зоны, в которые робот въезжал, — штрафов за первый въезд в зону с памятью не меньше, чем без неё. Приёмка не
  пройдена, если в (а) разность меньше 2 очков или интервал включает ноль; если возврат на базу в (а) ниже; если
  в (в) интервал целиком ниже −1; если на среднем уровне средняя потеря больше 1 очка. Устаревшая память
  признаётся вредной сверх допуска, если в (в) нижняя граница интервала ниже −1 при средней разности ниже нуля —
  это записывается отдельно, даже когда формальный порог (в) выполнен.
arms:
  - {id: adaptive_v2, label: Адаптивный v2 без памяти, agent: adaptive_v2}
  - {id: adaptive_v2_lab, label: Адаптивный v2 с памятью о лаборатории, agent: adaptive_v2_lab}
  - {id: scientist_v2, label: Исследователь v2 без памяти, agent: scientist_v2}
  - {id: scientist_v2_lab, label: Исследователь v2 с памятью о лаборатории, agent: scientist_v2_lab}
levels: [medium, hard]
seeds: 40
seed_start: 15001
conditions:
  - {id: base, label: Базовые правила}
  - id: science
    label: Научные правила
    rules: {drain_per_rad: 0.12, load_drain: 0.05, battery_sigma: 0.02, faults: true, hazard_battery_hit: 0.0}
chains:
  - {id: same_lab, label: Та же лаборатория, другие образцы, steps: [[own, 1], [own, 2], [own, 3]]}
  - {id: repeat, label: Тот же сценарий повторно, steps: [[own, 2], [own, 2], [own, 2]]}
  - {id: moved, label: Лабораторию переставили, steps: [[other, 1], [own, 2], [own, 3]]}
  - {id: repeat_std, label: Прежний сценарий повторно (справочно), steps: [[own, 0], [own, 0], [own, 0]]}
# Вторичная, более точная оценка (добавлено до заморозки кода и до итоговой серии, по итогам отладки: разброс
# парной разности счёта между прогонами около 16 очков, и 40 пар дают интервал шириной около ±5 очков):
# второй шаг цепочек same_lab и moved повторяется с той же памятью ещё на трёх раскладках образцов; разность
# усредняется внутри лаборатории, интервал — бутстреп по 40 лабораториям. Критерий приёмки считается по
# основной раскладке 2, как задано; оценка по четырём раскладкам приводится рядом.
step2_repeats: {chains: [same_lab, moved], layouts: [4, 5, 6]}
metrics: [score, samples_share, returned, hazard_hits, hazard_first, battery_used, false_collects]
