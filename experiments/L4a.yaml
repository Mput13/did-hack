title: Память планировщика на языковой модели — свои решения и их исходы внутри прогона
kind: llm
manual: "./px python tools/l4a_memory.py run main"
question: >-
  Сейчас каждый вызов модели-планировщика — отдельный запрос: модель видит карту, которую ведёт код (образцы, грунты,
  опасные зоны), но не видит собственных прошлых решений и того, чем они кончились. Меняются ли её решения и итог
  прогона, если дать ей эту память: последние решения с исходами и ценой, события, проверенные пустые места и места
  штрафов?
hypothesis: >-
  (1) Решения. В состояниях, где память указывает на нынешнюю цель (её идентификатор стоит в поле near у проверенного
  пустого места), модель с памятью выбирает такую цель реже, чем та же модель без памяти в том же состоянии.
  (2) Поведение. В прогонах с памятью повторных отправок в проверенное пустое место меньше, чем без памяти.
  (3) Счёт на обычной миссии не вырастет: в прошлых опытах модель выбирала то же, что правило, в 93–96% решений, а
  повторных отправок у правила на отладочных сценариях около полутора на прогон. Ожидаю «различие не показано»;
  «не хуже» утверждаю, только если интервал парной разности целиком выше −3 очков.
  (4) Миссии словами, которым нужна память о прошлом (N1 «не проверяй одно место дважды», N2 «два пустых подъезда
  подряд — домой», N3 «после штрафа не ближе метра»): с памятью выполняются чаще, чем без неё. Сильнее всего это
  должно быть видно на N2 — без памяти модель знает только про последний подъезд: с памятью не меньше 80% прогонов,
  где повод был, без памяти не больше 20%. На N3 модель без памяти может выполнять условие отчасти: места штрафов за
  опасные зоны она видит в списке hazards.
  (5) Цена: запрос вырастет меньше чем в полтора раза по токенам, доля годных с первой попытки ответов не упадёт
  больше чем на 5 процентных пунктов.
method: >-
  Модель qwen3.8-flash-next (сервер МАИ), быстрый симулятор, уровень hard, сценарии 14001–14010 — их не видели ни
  отладка, ни другие опыты; до заморозки кода они не запускаются, отладка — на сценариях 1–80. Три руки, парно по
  сценариям: rule — правило (adaptive); nomem — adaptive_llm; mem — adaptive_llm_mem (память в снимке состояния и
  подсказка planner_system_mem). У обеих рук с моделью модель отвечает на каждый повод (llm_min_interval_s = 0), как в
  L3c, чтобы решения были её, а не правила; в руке nomem память ведётся и пишется в запись (planner_memory = track),
  но в запрос не попадает — запросы побайтно те же, что у adaptive_llm (проверка в tests/test_l4a.py).
  Режим ожидания у обеих рук — off, мир стоит, пока модель думает (как в L3c и L3d): так измеряется содержание
  решений, а не цена ожидания. В режиме rule модель почти ничего не решает (7–9% вопросов, R16), а «стоять настоящее
  время ответа» и leash добавляют к счёту шум от времени ответа, которое у двух рук разное само по себе; время
  ответа и размер запроса меряются отдельно.
  Что меряется: счёт, образцы, возврат, штрафы; число решений; повторные отправки — решения, первая подцель которых
  лежит ближе 0,5 м от места, где робот уже стоял и образца не оказалось (ложный сбор — событие судьи; «кандидат не
  подтвердился на месте» — робот был ближе 0,3 м к цели последнего построенного пути), и от места прежнего штрафа;
  считается по планам, путям, треку и событиям записи одной функцией did.plan_memory.revisits для всех рук.
  Теневое сравнение A: в каждом состоянии, где решала модель с памятью (рука mem), тот же вопрос задаётся подсказке
  без памяти (снимок без полей памяти, прежняя подсказка); сравниваются первые подцели: с памятью, без памяти,
  правило. Теневое сравнение B: в состояниях руки nomem, где память указывает на нынешнюю цель (near не пуст у
  checked_empty или penalty_places), вопрос задаётся подсказке с памятью. Контроль шума C: на первых 40 состояниях
  руки mem вопрос без памяти задаётся второй раз (другой ключ кэша, тот же запрос к серверу) — как часто модель
  расходится сама с собой.
  Миссии N1–N3 (текст и критерий — did/plan_memory.py, MISSIONS и verify; записаны до прогонов): руки rule, nomem,
  mem; обвязка как в L3d (mission_triggers, модель отвечает на каждый повод). Сценарии для каждой миссии — первые 5
  из hard 14011–14040, где повод случился в прогоне правила (N1 — есть проверенное пустое место; N2 — два пустых
  подъезда подряд; N3 — есть штраф); отбор — по прогонам правила после заморозки кода, до запуска моделей. Прогон,
  где повода не было, миссию не проверяет и в знаменатель не идёт.
  Одновременно не больше двух запросов к серверу. Порядок по важности, на случай нехватки времени или отказа
  сервера: основная пара → тень A → N2 → N1 → N3 → тень B → контроль C → вторая модель МАИ (DeepSeek-V4-Flash,
  основная пара на 14001–14006). Что не досчитано — будет сказано. В конце — строгий повтор из кэша.
refute: >-
  (1) опровергнута, если в тех же состояниях доля выбора цели из near у модели с памятью не ниже, чем без памяти, или
  интервал парной разности включает ноль. (2) опровергнута, если интервал парной разности числа повторных отправок
  «mem − nomem» включает ноль или лежит выше нуля; при десяти сценариях и одной-двух отправках на прогон интервал
  будет широким — тогда вывод «различие не показано». (3) опровергнута как ожидание, если интервал разности счёта
  целиком выше нуля (память помогла) или целиком ниже −3 (память вредит). (4) опровергнута, если на N2 доля у модели
  с памятью не выше, чем без памяти (интервал разности долей включает ноль), или без памяти N2 выполняется чаще чем в
  половине прогонов с поводом — значит, память для неё не нужна. (5) опровергнута, если запрос вырос в полтора раза
  и больше или годных с первой попытки стало меньше на 5 пунктов.
levels: [hard]
seeds: 10
