title: Языковая модель как планировщик
kind: llm
question: Не ломает ли агента планировщик на языковой модели, в том числе когда модель ошибается?
hypothesis: >-
  Агент с языковой моделью на верхнем уровне работает не хуже агента с простым правилом, а при
  ошибках модели (обрыв ответа, неверный формат, несуществующая цель, недоступность) не падает и
  теряет в счёте немного — за счёт проверки плана и запасного правила.
method: >-
  Три варианта одного агента: подцели выбирает правило; выбирает модель; выбирает модель, у которой
  30% ответов испорчены разными способами. В сериях вместо настоящей модели стоит имитатор с тем же
  сетевым форматом — он проверяет обвязку, а не качество рассуждений. Качество настоящей модели
  проверяется отдельным прогоном с ключом доступа.
expect: Ни одного аварийного прогона; счёт с испорченной моделью ниже не более чем на несколько очков.
refute: Гипотеза опровергнута, если есть упавшие прогоны или счёт с испорченной моделью заметно ниже.
arms:
  - {id: rule, label: Правило, agent: adaptive}
  - {id: llm, label: Модель (имитатор), agent: adaptive_llm, llm: {kind: mock}}
  - id: llm_faulty
    label: Модель с ошибками 30%
    agent: adaptive_llm
    llm: {kind: mock, faults: {malformed: 0.08, wrapped: 0.08, invalid_target: 0.06, out_of_arena: 0.04, empty: 0.04}}
levels: [medium, hard]
seeds: 30
metrics: [score, samples_share, returned, battery_used]
claims:
  - {metric: score, a: llm_faulty, b: rule, text: Ошибки модели не снижают счёт, better: higher}
