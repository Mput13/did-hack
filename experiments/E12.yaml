title: Точность исследований по заданию
kind: science
rules: science
question: >-
  Можно ли верить числу и погрешности, которые робот возвращает по заданию пользователя — «измерь,
  во сколько раз пол в этой области дороже обычного» или «сколько заряда стоит поворот»?
hypothesis: >-
  Робот, который сам планирует замеры по заданию (что измерить, какими опытами, с каким бюджетом),
  называет искомую величину с ошибкой в единицы процентов, а его 95% интервал накрывает настоящее
  значение примерно в 95 случаях из 100. То есть заявленной погрешности можно верить: она не
  занижена и не завышена.
method: >-
  Каждое задание исполняется на одних и тех же сценариях. Цена пола: область — контур скрытой зоны
  грунта A (её множитель роботу не сообщают), разрешены прямые пробеги по 0,5 м и паузы, до двух
  контрольных участков, точность ±3 %, бюджет 50 ед. Тот же вопрос без контрольного участка: сравнивать
  приходится с номиналом из условия. Цена поворота: полные обороты на месте и паузы, точность ±5 %,
  бюджет 10 ед. После прогона оценка сверяется со скрытой правдой сценария: множителем грунта вдоль
  мерного участка в момент последнего учтённого замера и ценой поворота из правил стенда. На трудном
  уровне грунты меняются по ходу прогона, появляются опасные зоны и утечки заряда.
expect: >-
  Ошибка оценки цены пола — около процента, цены поворота — несколько процентов; доля интервалов,
  накрывших истину, — от 90 до 99 % (при 60 прогонах точнее не различить). Без контрольного участка
  оценка остаётся близкой к истине только потому, что номинал на стенде точен, а заявленная
  погрешность вырастает на порядок: робот честно говорит, что без контроля знает меньше.
refute: >-
  Гипотеза опровергнута, если интервалы накрывают истину реже чем в 85 % случаев (погрешность занижена)
  или медианная ошибка больше 5 %.
arms:
  - id: soil
    label: 'Цена пола: область против контроля'
    agent: study
    study:
      quantity: soil_cost
      region: {zone: A}
      allowed: {straight: {length_m: 0.5, repeats: 2}, pause: {seconds: 3}}
      controls: {max: 2}
      stop: {rel_error: 0.03, max_measurements: 14, time_s: 300}
      budget: {energy: 50, reserve: 3}
  - id: soil_nominal
    label: 'Цена пола: без контроля, против номинала'
    agent: study
    study:
      quantity: soil_cost
      region: {zone: A}
      allowed: {straight: {length_m: 0.5, repeats: 2}, pause: {seconds: 3}}
      controls: {max: 0}
      stop: {rel_error: 0.03, max_measurements: 14, time_s: 300}
      budget: {energy: 50, reserve: 3}
  - id: turn
    label: 'Цена поворота: обороты и паузы'
    agent: study
    study:
      quantity: turn_cost
      allowed: {spin: {angle_deg: 360, repeats: 2}, pause: {seconds: 3}}
      stop: {rel_error: 0.05, max_measurements: 12, time_s: 200}
      budget: {energy: 10, reserve: 1}
levels: [medium, hard]
seeds: 30
metrics: [study_error_pct, study_covered, study_halfwidth_pct, study_reached, study_energy, study_time, study_measurements, returned]
claims:
  - {metric: study_halfwidth_pct, a: soil, b: soil_nominal, text: 'С контрольным участком заявленная погрешность меньше, чем при сравнении с номиналом', better: lower}
