title: Выбор с учётом риска
kind: science
rules: science
question: >-
  Что даёт агенту сравнение будущих маршрутов — оценка каждого варианта плана в нескольких десятках
  возможных состояний среды — по сравнению с жёстким запасом на возврат?
hypothesis: >-
  Агент, который перед выездом к цели проигрывает варианты плана («цель и домой», «сразу домой») в
  возможных состояниях среды и отбрасывает те, где вероятность не вернуться выше порога, возвращается
  на базу не реже и собирает не меньше образцов, чем такой же агент с запасом «дорога домой × 1,1 + 4 ед.».
method: >-
  Те же правила, что в опыте E10: расход зависит от грунта, поворотов, груза и утечки после въезда в
  опасную зону. Исследователь и адаптивный агент проходят одни и те же сценарии в двух видах: с жёстким
  запасом и со сравнением вариантов (did/foresight.py). В сравнении 48 состояний среды; они различаются
  тем, чего агент не знает: где на непроверенном полу дорогой грунт и ненайденные опасные зоны, есть ли
  образец в цели, сколько стоит метр, сколько продлится утечка. Порог риска 15% подобран на отладочных
  сценариях 1–80; рядом показаны порог 5% и выбор цели по наибольшему ожидаемому счёту вместо правила
  планировщика.
expect: >-
  Основной выигрыш — на уровне hard, где среда меняется: возвратов больше при том же числе образцов.
  При пороге 5% возврат почти всегда, но образцов меньше.
refute: >-
  Гипотеза опровергнута, если со сравнением вариантов агент возвращается реже или собирает заметно
  меньше образцов, чем с жёстким запасом.
arms:
  - {id: scientist, label: Исследователь, agent: scientist}
  - {id: scientist_fs, label: Исследователь + оценка риска, agent: scientist_fs}
  - {id: scientist_fs05, label: Исследователь + оценка риска (порог 5%), agent: scientist_fs, config: {risk_limit: 0.05}}
  - {id: scientist_fs_score, label: Исследователь + выбор по ожидаемому счёту, agent: scientist_fs, config: {foresight_choice: score}}
  - {id: adaptive, label: С адаптацией, agent: adaptive}
  - {id: adaptive_fs, label: С адаптацией + оценка риска, agent: adaptive_fs}
  - {id: adaptive_fs05, label: С адаптацией + оценка риска (порог 5%), agent: adaptive_fs, config: {risk_limit: 0.05}}
levels: [medium, hard]
seeds: 60
metrics: [returned, samples_share, score, battery_used]
claims:
  - {metric: returned, a: scientist_fs, b: scientist, text: Исследователь с оценкой риска возвращается на базу не реже, better: higher}
  - {metric: samples_share, a: scientist_fs, b: scientist, text: Исследователь с оценкой риска собирает не меньше образцов, better: higher}
  - {metric: score, a: scientist_fs, b: scientist, text: Счёт исследователя с оценкой риска не ниже, better: higher}
  - {metric: returned, a: adaptive_fs, b: adaptive, text: Адаптивный агент с оценкой риска возвращается на базу не реже, better: higher}
  - {metric: samples_share, a: adaptive_fs, b: adaptive, text: Адаптивный агент с оценкой риска собирает не меньше образцов, better: higher}
  - {metric: score, a: adaptive_fs, b: adaptive, text: Счёт адаптивного агента с оценкой риска не ниже, better: higher}
