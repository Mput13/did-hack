title: Результативность — агент v5 (пересчёт карты образцов, не теряющий соседа, B1) против v2
kind: main
question: Даёт ли пересчёт карты образцов после сбора, который сохраняет известное место соседнего образца и не пускает в карту показания, снятые при распознанном сбое датчика, прибавку счёта на новых сценариях трудного уровня — и не вредит ли он при научных правилах, на среднем уровне и без событий среды?
hypothesis: >-
  Разбор на отладочных сценариях (research/findings/B1.md, раздел «Диагноз») показал: вред прежней пробы точного
  пересчёта (exact_replay) при научных правилах наполовину был свойством набора сценариев (на сценариях 1–80
  −4,11 [−6,80; −1,48], на следующих 81–160 −0,07 [−3,37; +3,47], вместе −2,09 [−4,24; +0,11]), а в остальном
  складывается из двух причин: показания залипшего датчика после точного пересчёта дают больше ложных кандидатов
  (26 против 14 на 35 сборах), и точная карта, применённая на каждом сборе, меняет ход почти каждого прогона и
  прибавляет первые въезды в опасные зоны (87 → 122 на 160 прогонов), каждый из которых при научных правилах стоит
  5 очков и запускает сбой. Пересчёт пресетов v5 убирает обе: показания, которым нельзя верить (залипшие и шумные,
  по признакам из самого журнала показаний), в карту после сбора не идут, а точная карта берётся только там, где
  прежний пересчёт стирает уже известное место. На отладочных сценариях 1–160 трудного уровня это дало при базовых
  правилах +0,59 [−0,56; +1,72], при научных −0,00 [−0,98; +1,01]; известных соседних мест сохраняется 51 из 106
  против 19 из 106. Ожидание на новых сценариях: трудный уровень, базовые правила — прибавка от 0 до +1 очка
  (потолок по разбору потерь — статья «образец: причина неясна», 1,0–2,75 очка на прогон на разных наборах, из неё
  стёртые пересчётом места — около половины, и сохраняется из них половина); при 40 сценариях интервал парной
  разности будет около ±2 очков, поэтому порог приёмки «+1,5 и интервал выше нуля», скорее всего, взят не будет.
  При научных правилах ожидается разность около нуля; на отладке возвратов было меньше на 4 из 160 (интервал
  [−5,6; 0,0] п.п.), так что условие «возврат не ниже» под риском. На среднем уровне и без событий — без изменений.
method: >-
  Четыре агента (adaptive_v2, adaptive_v5, scientist_v2, scientist_v5) проходят одни и те же сценарии 17001–17040
  уровней medium и hard при трёх условиях: базовые правила, «научные» правила и базовые правила без событий среды.
  Диагноз, выбор между тремя вариантами пересчёта (full, gated, gated_clean) и все числа настроек — на отладочных
  сценариях 1–80 и на втором отладочном наборе 81–160 (в прежних опытах не использовался). Сценарии 17001–17040 до
  этого опыта не запускались и не просматривались; код заморожен коммитом до запуска, запуск один. Сравниваются
  парные разности «v5 − v2» с 95% интервалом (бутстреп по сценариям), возврат, ложные сборы, штрафы; статьи потерь
  до и после — tools/loss_breakdown.py.
expect: >-
  Критерий приёмки (задан ведущим до работы): трудный уровень, базовые правила — счёт adaptive_v5 выше, чем у
  adaptive_v2, на 1,5 очка и больше, 95% интервал парной разности выше нуля; возврат на базу не ниже; ложных сборов
  не больше. Трудный уровень, научные правила — не хуже чем на 1 очко (интервал не целиком ниже −1) и возврат не
  ниже. Средний уровень и условие без событий среды — не хуже чем на 1 очко.
refute: >-
  Приёмка не пройдена при любом нарушении критерия. Гипотеза «пересчёт возвращает очки на трудном уровне»
  опровергнута, если при базовых правилах парная разность счёта adaptive_v5 − adaptive_v2 ниже нуля или её интервал
  целиком ниже +0,5; не показана — если интервал включает ноль. Гипотеза «пересчёт не вредит при сбоях датчика»
  опровергнута, если при научных правилах интервал разности счёта целиком ниже нуля или ложных сборов у v5 больше,
  чем у v2.
arms:
  - {id: adaptive_v2, label: Адаптивный v2, agent: adaptive_v2}
  - {id: adaptive_v5, label: Адаптивный v5, agent: adaptive_v5}
  - {id: scientist_v2, label: Исследователь v2, agent: scientist_v2}
  - {id: scientist_v5, label: Исследователь v5, agent: scientist_v5}
levels: [medium, hard]
seeds: 40
seed_start: 17001
conditions:
  - {id: base, label: Базовые правила}
  - id: science
    label: Научные правила
    rules: {drain_per_rad: 0.12, load_drain: 0.05, battery_sigma: 0.02, faults: true, hazard_battery_hit: 0.0}
  - {id: no_events, label: Событий среды нет, scenario: {events: []}}
metrics: [score, samples_share, returned, penalties, hazard_hits, false_collects, time, distance, battery_used]
claims:
  - {metric: score, a: adaptive_v5, b: adaptive_v2, focus: hard, conditions: [base],
     text: Адаптивный v5 набирает больше v2 на базовых правилах}
  - {metric: score, a: adaptive_v5, b: adaptive_v2, focus: hard, kind: noninferiority, margin: 1.0,
     conditions: [science], text: Адаптивный v5 не хуже v2 на научных правилах}
  - {metric: returned, a: adaptive_v5, b: adaptive_v2, focus: hard, better: higher, kind: noninferiority, margin: 0.05,
     conditions: [base, science], text: Адаптивный v5 возвращается не реже v2}
  - {metric: false_collects, a: adaptive_v5, b: adaptive_v2, focus: hard, better: lower, kind: noninferiority, margin: 0.05,
     conditions: [base, science], text: У адаптивного v5 ложных сборов не больше, чем у v2}
  - {metric: score, a: adaptive_v5, b: adaptive_v2, focus: medium, kind: noninferiority, margin: 1.0,
     conditions: [base, science], text: Адаптивный v5 не теряет очков на среднем уровне}
  - {metric: score, a: adaptive_v5, b: adaptive_v2, focus: hard, kind: noninferiority, margin: 1.0,
     conditions: [no_events], text: Адаптивный v5 не хуже v2 без событий среды}
  - {metric: score, a: scientist_v5, b: scientist_v2, focus: hard, conditions: [base],
     text: Исследователь v5 набирает больше v2 на базовых правилах}
  - {metric: score, a: scientist_v5, b: scientist_v2, focus: hard, kind: noninferiority, margin: 1.0,
     conditions: [science], text: Исследователь v5 не хуже v2 на научных правилах}
  - {metric: returned, a: scientist_v5, b: scientist_v2, focus: hard, better: higher, kind: noninferiority, margin: 0.05,
     conditions: [base, science], text: Исследователь v5 возвращается не реже v2}
