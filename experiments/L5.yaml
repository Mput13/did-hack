title: Как правило и шесть моделей МАИ выбирают цель там, где выбор настоящий (цена выбора задним числом)
kind: llm
manual: "./px python tools/l5_bank.py bank | values | ask | report (см. research/findings/L5.md)"
question: >-
  В L2 счёт шести моделей МАИ совпал со счётом правила, потому что в 96 % состояний они выбирают ту же цель. Чей выбор
  лучше там, где у планировщика есть настоящий выбор, и где само правило теряет очки относительно лучшего варианта?
hypothesis: >-
  H1. В состояниях с настоящим выбором хотя бы одна из шести моделей выбирает лучше правила: средняя по банку парная
  разность «цена выбора модели − цена выбора правила» выше нуля.
  H2. Модели различаются между собой по цене выбора больше, чем на погрешность.
  H3. У правила есть запас: его выбор в среднем хуже лучшего варианта на 1,5 очка и больше.
  H4 (если из разбора получится простая правка правила): агент с правкой набирает на новых сценариях трудного уровня
  на 1,5 очка больше нынешнего.
  Ожидание, записанное до прогонов: скорее всего, H1 и H2 не подтвердятся. Подсказка планировщика содержит формулу
  правила, модели ей следуют, поэтому и в банке они в большинстве состояний (ожидаю от 80 %) выберут то же, что
  правило, а там, где разойдутся, цена выбора будет отличаться в пределах шума. Про H3 уверенности нет: агент
  пересчитывает план каждые несколько секунд, поэтому одно другое решение редко меняет исход прогона — возможно,
  правило близко к лучшему варианту почти везде. Это тоже результат.
method: >-
  Банк. Агент adaptive_v2 (нынешний адаптивный агент: adaptive с пережиданием сбоя датчика), быстрый симулятор,
  базовые правила, уровни hard и medium, сценарии 16001–16040 (до этого опыта не запускались) — 80 прогонов.
  Решение — каждый вызов планировщика. Допустимые варианты первой подцели: investigate для каждого кандидата с
  feasible, explore для каждой точки разведки с feasible, return_base. В банк годятся решения с t > 0 (стартовое
  состояние одинаково во всех сценариях) и хотя бы двумя вариантами. Виды состояний считаются только по сводке
  состояния: time_short — до предела времени не больше 120 с; sensor_bad — sensor.status = degraded; almost_done —
  не собран один образец; low_battery — заряд не выше 20; weak_near_strong_far — годных кандидатов два и больше,
  выбор по формуле правила — не самый уверенный кандидат, а самый уверенный увереннее его на 0,15 и больше;
  weak_only — годные кандидаты есть, и у всех уверенность ниже 0,5; danger_near — центр опасной зоны или
  подтверждённой зоны грунта с множителем от 1,5 ближе (радиус + 0,6 м) к роботу или к годной цели; high_battery —
  заряд от 40 и годных кандидатов два и больше; explore_only — годных кандидатов нет, годных точек разведки две и
  больше. Отбор: виды в этом порядке, по 10 состояний на вид; внутри вида порядок — по sha256 от строки
  «L5|уровень|сценарий|номер решения»; состояние пропускается, если уже взято, если из этого прогона в этот вид уже
  взято два, если из этого прогона всего взято шесть или если ближе 5 с к уже взятому из того же прогона. Потом
  добор до 90 состояний из всех годных в том же порядке с теми же ограничениями. Отбор не смотрит ни на ответы
  моделей, ни на цену вариантов.
  Мерило. Прогон повторяется до того же решения (симулятор детерминирован), вместо решения планировщика
  подставляется вариант, дальше агент доигрывает как обычно, правилом. Цена варианта — средний итоговый счёт судьи
  по 8 продолжениям: одно с исходным шумом и семь, в которых шум датчика образцов и лидара после момента решения
  пересеян (мир и скрытая правда те же). Повтор без подстановки с исходным шумом обязан дать исходный счёт до сотых.
  Это оценка с подглядыванием в будущее: в ней участвует скрытая правда сценария. Она годится только как мерило;
  агенту её давать нельзя.
  Сравнение. Правило и шесть моделей (qwen3.8-flash-next, qwen3.8-27b, qwen3.6-35b-a3b, Qwen3.5-122B-A10B,
  deepseek-v4.1-flash, DeepSeek-V4-Flash; сервер МАИ, клиент did/llm.py) получают каждое состояние банка один раз:
  подсказка и схема нынешнего планировщика без изменений, один запрос без исправления, запас 3000 токенов, срок
  90 с, ответы в кэш. Сравнивается первая подцель. Негодный ответ или отсутствие ответа считается выбором правила
  (так поступает агент) и учитывается отдельно; запрос, на который сервер не ответил, переспрашивается не больше
  одного раза. Если модель выбрала допустимую цель не из таблицы (goto), её цена считается тем же инструментом.
  Числа: доля годных ответов с первой попытки; парная разность цены выбора с правилом (среднее, 95 % интервал —
  бутстреп по состояниям, для проверки — по сценариям); потеря относительно лучшего варианта двумя способами —
  прямая (лучший по тем же 8 продолжениям; завышена, потому что лучший из шумных всегда выглядит лучше) и
  перекрёстная (лучший выбирается по продолжениям с чётными номерами, цена считается по нечётным, и наоборот);
  доля состояний, где цена выбора выше или ниже цены выбора правила больше чем на 1 очко; согласие первой подцели
  попарно; время ответа. Отдельно — по видам состояний. Дополнительно: цена полного плана модели (все подцели, как
  их исполнил бы агент).
refute: >-
  H1 опровергнута, если ни у одной модели интервал парной разности с правилом (с поправкой на шесть сравнений —
  уровень 99,2 %) не лежит выше нуля. H2 опровергнута, если ни в одной из 15 пар моделей интервал парной разности
  (с поправкой — уровень 99,67 %) не исключает ноль. H3 опровергнута, если перекрёстная потеря правила в среднем
  меньше 1,5 очка и верхняя граница её 95 % интервала ниже 1,5; «не показано», если 1,5 внутри интервала.
  H4 (критерий задан ведущим до работы): трудный уровень, базовые правила, сценарии 16041–16080 — счёт агента с
  правкой выше adaptive_v2 на 1,5 очка и больше, интервал выше нуля, возврат не ниже; иначе правка не принята.
levels: [hard, medium]
seeds: 40
seed_start: 16001
