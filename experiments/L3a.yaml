title: Модель МАИ в ролях автора и критика гипотез против исследователя на коде
kind: llm
manual: "./px python tools/l3_roles.py"
rules: science
question: >-
  Что меняется в расследованиях робота, если объяснения и опыты отбирает не расчёт, а языковая модель МАИ
  (автор плана расследования и критик)? Что при этом решает модель, а что по-прежнему считает код?
hypothesis: >-
  Исследователь на коде уже почти не ошибается (на отладочных сценариях 1–40 верны 234 вывода из 241), поэтому
  модель в ролях автора и критика числа не улучшит. Ожидаем «не хуже»: доля верных выводов о причине не ниже, чем у
  кода, больше чем на 5 процентных пунктов, счёт не ниже больше чем на 1 очко (допуск назван заранее). Модель
  отвечает по схеме не реже 90% с первой попытки; критик требует правки меньше чем в 20% расследований; в режиме
  «опыты в порядке модели» первый опыт модели совпадает с выбором расчёта не реже 80%.
method: >-
  Агент scientist (планировщик — правило, чтобы различались только роли) на правилах science, уровни hard
  (1001–1020) и medium (1001–1010). Варианты: code — без модели; roles — модель в ролях в обвязке как есть (модель
  выбирает, какие объяснения рассматривать; опыт по-прежнему выбирает расчёт по ожидаемой пользе); plan — флажок
  inquiry_follow_plan: опыты идут в порядке плана модели, расчёт пользы на выбор не влияет. Вероятности и вывод во
  всех вариантах считает код. Модель — qwen3.8-flash-next; вариант plan повторён на DeepSeek-V4-Flash и
  qwen3.6-35b-a3b. Выводы сверяются со скрытой правдой сценария (did.metrics.score_inquiries, как в E17).
  Прогоны вариантов расходятся после первого отличия, поэтому расследования между вариантами не парные: сравниваются
  доли по всем расследованиям и парная разность счёта по сценариям.
refute: >-
  Гипотеза «не хуже» опровергнута, если 95% интервал парной разности счёта (модель − код) целиком ниже −1 очка или
  доля верных выводов у варианта с моделью ниже, чем у кода, больше чем на 5 пунктов при интервале разности долей
  целиком ниже нуля. Ожидание о формате опровергнуто при доле годных с первой попытки ниже 80%.
levels: [hard, medium]
seeds: 20
