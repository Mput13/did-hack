title: Стратегии поиска образцов
kind: main
question: >-
  Что лучше ищет образцы по датчику, который показывает только близость: простые правила из условия
  задачи (спираль, подъём по сигналу, объезд по готовому маршруту) или карта вероятностей? И помогает
  ли выбирать точку разведки по расчёту ожидаемой пользы измерения, а не по прикидке?
hypothesis: >-
  Агент с картой вероятностей соберёт больше образцов, чем спираль и подъём по сигналу, и потратит на
  это меньше заряда. Выбор точки разведки по ожидаемой пользе измерений даст путь и расход заряда не
  больше, чем прежняя прикидка «сколько вероятности вокруг точки».
method: >-
  Пять агентов проходят одни и те же сценарии: одинаковые места образцов и грунты. Спираль едет дугами
  растущего радиуса вокруг базы и заезжает за образцом при сильном сигнале. Подъём по сигналу шагает
  туда, где показание растёт, а без сигнала едет слушать в новое место. Фиксированный объезд идёт по
  маршруту, составленному до старта. Два агента с картой вероятностей отличаются одним: как выбрана
  точка разведки — по сумме вероятностей вокруг неё или по тому, на сколько бит измерения по дороге
  и на месте уменьшат неопределённость карты. Сравниваем разности на каждом сценарии.
expect: >-
  На easy разница между стратегиями мала: образцов три и заряда хватает всем. На medium простые
  стратегии не успевают объехать арену до порога возврата. Между двумя способами выбора точки
  разведки разница небольшая: разведка занимает меньше трети пути.
refute: >-
  Гипотеза опровергнута, если подъём по сигналу или спираль собирают не меньше образцов, чем агент с
  картой вероятностей, или если с расчётом ожидаемой пользы агент проезжает больше и тратит больше
  заряда, чем с прикидкой.
arms:
  - {id: spiral, label: Спираль, agent: spiral}
  - {id: gradient, label: Подъём по сигналу, agent: gradient}
  - {id: fixed, label: Фиксированный объезд, agent: fixed}
  - {id: adaptive, label: 'Карта вероятностей, прикидка', agent: adaptive}
  - {id: adaptive_ig, label: 'Карта вероятностей, ожидаемая польза', agent: adaptive_ig}
levels: [easy, medium]
seeds: 40
metrics: [samples_share, distance, battery_used, false_collects, score]
claims:
  - {metric: samples_share, a: adaptive, b: gradient, text: 'Карта вероятностей собирает больше образцов, чем подъём по сигналу'}
  - {metric: samples_share, a: adaptive, b: spiral, text: 'Карта вероятностей собирает больше образцов, чем спираль'}
  - {metric: battery_used, a: adaptive, b: gradient, text: 'Карта вероятностей тратит меньше заряда, чем подъём по сигналу'}
  - {metric: distance, a: adaptive_ig, b: adaptive, text: 'С ожидаемой пользой путь не длиннее, чем с прикидкой', better: lower}
  - {metric: battery_used, a: adaptive_ig, b: adaptive, text: 'С ожидаемой пользой заряда уходит не больше, чем с прикидкой', better: lower}
  - {metric: samples_share, a: adaptive_ig, b: adaptive, text: 'С ожидаемой пользой собрано не меньше образцов, чем с прикидкой', better: higher}
